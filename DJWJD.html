<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>휘블록스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&family=JetBrains+Mono:wght@600;800&display=swap">
<style>
/* Layout: toy-block game shelf — sticky bar, featured stage, quick-panels (missions · attendance · job), category shelves */
:root{
  --bg:#eef1f6;--card:#ffffff;--ink:#14182b;--sub:#5d667d;--line:#d8dde8;--shadow:#c9cfdc;--soft:#f4f6fa;
  --tomato:#f2553c;--sun:#ffc531;--teal:#19a7a0;--grape:#6a4cff;--sky:#3aa0ff;
  --display:"Black Han Sans","Gothic A1",sans-serif;--body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#1a1f2b;--ink:#f2f4f8;--sub:#9aa3b8;--line:#2a3042;--shadow:#0a0c12;--soft:#141824;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131c;--card:#1a1f2b;--ink:#f2f4f8;--sub:#9aa3b8;--line:#2a3042;--shadow:#0a0c12;--soft:#141824;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:22px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:2px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo .blk{display:grid;grid-template-columns:repeat(2,12px);gap:3px}
.logo .blk i{width:12px;height:12px;border-radius:3px;display:block}
.logo b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.search{flex:1;min-width:0}
.search input{width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px 14px}
.pill{display:flex;align-items:center;gap:6px;font:800 14px var(--mono);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill i{width:16px;height:16px;border-radius:4px;background:var(--sun);display:grid;place-items:center;font:900 10px var(--body);font-style:normal;color:#5a3d00}
.pill.lv i{background:var(--grape);color:#fff}
.me{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px 10px 3px 3px}
.me canvas{width:34px;height:34px;border-radius:9px;background:var(--bg)}
.me span{font-weight:800;font-size:13px;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:700px){.bar{flex-wrap:wrap}.search{order:5;flex-basis:100%}.me span{display:none}.pill.lv{display:none}}
.hero{display:grid;grid-template-columns:1.35fr 1fr;background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 0 var(--shadow)}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.hero .art{position:relative;min-height:220px;aspect-ratio:16/10;background:#111}
.hero .art canvas,.hero .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.heroTxt{padding:22px;display:grid;gap:10px;align-content:center}
.heroTxt .tag{justify-self:start}
.heroTxt h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(32px,5vw,46px);line-height:1.05;text-wrap:balance}
.heroTxt p{margin:0;color:var(--sub);max-width:48ch}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:24px;height:8px;border-radius:4px;border:0;background:var(--line);padding:0}
.dots button.on{background:var(--ink)}
.play{justify-self:start;font:800 17px var(--body);background:var(--sun);color:#3a2800;border:0;border-radius:14px;padding:12px 26px;box-shadow:0 5px 0 #c99712}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #c99712}
.tag{display:inline-block;font:800 11px var(--body);letter-spacing:.04em;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:860px){.quick{grid-template-columns:1fr}}
.qp{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:9px;box-shadow:0 4px 0 var(--shadow);align-content:start}
.qp h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qp h3 small{font:600 12px var(--body);color:var(--sub)}
.ms{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13.5px}
.ms .pb{grid-column:1/-1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.ms .pb i{display:block;height:100%;background:var(--teal);border-radius:3px}
.mini{font:800 12px var(--body);border:0;border-radius:9px;padding:5px 10px;background:var(--sun);color:#3a2800}
.mini[disabled]{background:var(--soft);color:var(--sub);cursor:default}
.att{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.att div{background:var(--soft);border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;color:var(--sub);display:grid;gap:1px}
.att div b{font:800 12px var(--mono);color:var(--ink)}
.att div.got{background:var(--teal);color:#e8fffb}.att div.got b{color:#fff}
.att div.now{outline:2px solid var(--sun)}
.jobRow{display:flex;gap:10px;align-items:center}
.jobRow .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:400 22px var(--display);color:#fff;flex:none}
.xpb{height:7px;border-radius:4px;background:var(--soft);overflow:hidden}.xpb i{display:block;height:100%;background:var(--grape)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shelf{display:grid;gap:10px}
.shelf h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.shelf h2 small{font-family:var(--body);font-size:13px;color:var(--sub);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:0;text-align:left;overflow:hidden;display:grid;box-shadow:0 4px 0 var(--shadow);transition:transform .12s;position:relative}
.tile:hover{transform:translateY(-3px)}
.tile canvas,.tile img{width:100%;aspect-ratio:4/3;display:block;object-fit:cover;background:#1a1d27}
.tile .meta{padding:9px 11px 11px;display:grid;gap:3px;min-width:0}
.tile b{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .row{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:11.5px;color:var(--sub)}
.tile .best{font:700 11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .new{position:absolute;top:8px;left:8px;background:var(--tomato);color:#fff;font:800 10.5px var(--body);padding:2px 7px;border-radius:6px}
.empty{color:var(--sub);font-size:14px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(8,10,18,.55);display:grid;place-items:center;padding:20px}
.ov[hidden]{display:none}
.modal{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 8px 0 var(--shadow);display:grid}
.modal .cover{width:100%;aspect-ratio:16/9;display:block;object-fit:cover;background:#111}
.mbody{padding:18px;display:grid;gap:10px}
.mbody h3{margin:0;font-family:var(--display);font-weight:400;font-size:30px}
.mbody p{margin:0;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--soft);border-radius:12px;padding:8px 10px;display:grid;font:800 16px var(--mono);font-variant-numeric:tabular-nums;min-width:0}
.stats span{font:600 11px var(--body);color:var(--sub)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;border:2px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:800}
.avatarBox{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
@media(max-width:520px){.avatarBox{grid-template-columns:1fr}}
.avatarBox canvas{width:150px;height:150px;border-radius:18px;background:var(--soft);justify-self:center}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:8px;border:3px solid transparent}
.sw button.on{border-color:var(--ink)}
.hats,.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.hats button,.jobs button{background:var(--soft);border:2px solid var(--line);border-radius:10px;padding:7px;font-size:12.5px;font-weight:700;display:grid;gap:1px;text-align:left}
.hats button.on,.jobs button.on{border-color:var(--grape)}
.hats small,.jobs small{font:600 10.5px var(--body);color:var(--sub);line-height:1.35}
.jobs b{font-size:13.5px}
.lab{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--soft);border:0;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.rk{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:7px 10px;font-size:14px}
.rk .no{font:800 14px var(--mono);color:var(--grape);text-align:center}.rk .sc{font:800 13px var(--mono)}
.rk.me{outline:2px solid var(--teal)}
.rk em{font-style:normal;font-size:10px;background:var(--grape);color:#fff;border-radius:5px;padding:1px 5px;margin-left:4px}
#player{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
#player[hidden]{display:none}
#pbar{flex:none;display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));background:#10131c;color:#f2f4f8}
#pbar button{background:#262c3d;color:#fff;border:0;border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px}
#pbar b{font-family:var(--display);font-weight:400;font-size:18px}
#pbar[hidden]{display:none}
#frame{flex:1 1 auto;width:100%;min-height:0;border:0;display:block;background:#000}
#match{position:fixed;inset:0;z-index:35;background:rgba(6,8,14,.82);display:grid;place-items:center;padding:20px;color:#f2f4f8}
#match[hidden]{display:none}
#match .box{width:min(360px,100%);background:#1a1f2b;border:2px solid #2c3346;border-radius:20px;padding:22px;display:grid;gap:12px;text-align:center}
#match h3{margin:0;font:400 30px var(--display)}
#match p{margin:0;color:#aeb6c8;font-size:14px}
#match .spin{width:54px;height:54px;border-radius:50%;border:6px solid #2c3346;border-top-color:var(--sun);margin:4px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#match button{background:#2a3144;color:#fff;border:0;border-radius:12px;padding:10px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.25);animation:up .3s ease;max-width:calc(100% - 32px);text-align:center}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="bar">
    <button class="logo" id="logo" aria-label="휘블록스 처음 화면"><span class="blk"><i style="background:var(--tomato)"></i><i style="background:var(--sun)"></i><i style="background:var(--teal)"></i><i style="background:var(--grape)"></i></span><b>휘블록스</b></button>
    <div class="search"><input id="q" placeholder="게임 찾기" autocomplete="off" aria-label="게임 찾기"></div>
    <div class="pill lv" title="휘블록스 레벨"><i>L</i><span id="lvN">1</span></div>
    <div class="pill" title="휘벅스: 게임을 하면 모인다"><i>휘</i><span id="buxN">0</span></div>
    <button class="me" id="meBtn"><canvas id="meCv" width="68" height="68"></canvas><span id="meName">플레이어</span></button>
  </header>

  <section class="hero"><div class="art" id="heroArt"></div><div class="heroTxt"><span class="tag" id="heroTag"></span><h1 id="heroName"></h1><p id="heroDesc"></p><button class="play" id="heroPlay">플레이</button><div class="dots" id="dots"></div></div></section>

  <section class="quick">
    <div class="qp"><h3>오늘의 미션<small>자정에 새로 바뀐다</small></h3><div id="missions" style="display:grid;gap:10px"></div></div>
    <div class="qp"><h3>출석 보상<small id="attInfo"></small></h3><div class="att" id="att"></div><button class="play" id="attBtn" style="justify-self:stretch;padding:9px">받기</button></div>
    <div class="qp"><h3>내 직업<small>모든 게임에 효과</small></h3><div id="jobBox" style="display:grid;gap:8px"></div></div>
  </section>

  <div class="chips" id="chips"></div>
  <div id="shelves" style="display:grid;gap:26px"></div>
</div>

<div class="ov" id="detail" hidden><div class="modal" id="detailBox"></div></div>
<div class="ov" id="profile" hidden><div class="modal"><div class="mbody" id="profileBox"></div></div></div>
<div id="player" hidden><div id="pbar"><button id="pBack">← 휘블록스</button><b id="pName"></b></div><iframe id="frame" title="게임" allow="autoplay; fullscreen; pointer-lock"></iframe></div>
<div id="match" hidden><div class="box" id="matchBox"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('hwi-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('hwi-'+k,JSON.stringify(v))}catch(e){}}};
const CATS={horror:['공포·모험','#4b4458'],rpg:['RPG·전략','#6a4cff'],action:['액션','#f2553c'],arcade:['아케이드','#ff8a2a'],puzzle:['퍼즐','#19a7a0'],brain:['두뇌·보드','#3aa0ff'],sim:['경영·키우기','#2fa04a'],race:['레이싱·스포츠','#d9356e'],party:['음악·파티','#b04cd9']};
const BIG=[
  {id:'ash',name:'잿빛 저택',cat:'horror',file:'ash.html',big:1,desc:'색이 사라진 저택에서 열쇠와 비밀번호를 찾아 탈출하는 3D 공포 게임. 챕터 2 지하실, 술래잡기·숨바꼭질, 커스텀 맵, 멀티플레이까지.',how:'WASD·마우스, 모바일은 화면 조작'},
  {id:'sprout',name:'새싹 모험기',cat:'rpg',file:'sprout.html',big:1,desc:'새싹 시티에서 시작하는 3D 오픈월드 RPG (최고 Lv.200). 차원 군도 5개 섬 · 직업 · 던전 · 히든 보스 · 장비 승급·초월 · 마이홈 · 아파트 단지 입주, 그리고 같은 서버에서 함께 노는 멀티플레이(채팅 · 이모트 · 파티 · PvP · 클럽 · 친구).',how:'WASD·마우스, 모바일은 화면 조작 · Enter 채팅 · G 이모트'}];
const GAMES=[...BIG,...[{"id": "deck", "name": "턴제 카드 · 덱 로그라이크", "how": "12층 탑을 오른다. 층마다 길을 고르고, 전투에서는 에너지를 써서 카드를 낸다. 적 머리 위 표시가 다음 행동이다. 이기면 카드를 하나 골라 덱을 키운다. 12층 잿빛 왕을 쓰러뜨려라.", "cat": "rpg", "desc": "카드로 싸우며 12층 탑을 오르는 덱 빌딩 로그라이크. 길 고르기·상점·모닥불·정예·보스.", "par": 1200.0, "feat": 1}]];
const G_=id=>GAMES.find(g=>g.id===id);

/* ── profile ── */
const JOBS=[['adv','모험가','#5d667d','경험치 +10%',0,{xp:.1}],['merch','상인','#e0a014','휘벅스 보상 +25%',300,{coin:.25}],['scholar','학자','#3aa0ff','경험치 +50%',300,{xp:.5}],['guard','수호자','#19a7a0','목숨 있는 게임에서 목숨 +1',600,{life:1}],['gambler','도박사','#b04cd9','행운 +30% · 가끔 보상 2배',500,{luck:.3,jack:.15}],['gladi','검투사','#f2553c','듀얼 보상 2배 · 휘벅스 +10%',450,{duel:1,coin:.1}],['ninja','닌자','#14182b','행운 +15% · 경험치 +20%',700,{luck:.15,xp:.2}],['king','왕','#ffb000','휘벅스 +40% · 경험치 +20%',2000,{coin:.4,xp:.2}]];
const HATS=[['none','없음',0],['cap','모자',50],['phones','헤드폰',80],['halo','후광',100],['wizard','마법사 모자',120],['horns','뿔',150],['band','머리띠',90],['top','신사 모자',200],['crown','왕관',300]];
const PAL=['#ffd2a8','#c98a5a','#8a5a3a','#f2553c','#ff9a3c','#ffc531','#4fd17a','#19a7a0','#3aa0ff','#6a4cff','#ff6ad5','#14182b','#f2f4f8'];
const MISS=[['play','게임 3판 하기',3,30],['diff','서로 다른 게임 3개 하기',3,40],['best','최고 기록 1번 깨기',1,40],['duel','듀얼 1번 하기',1,50],['earn','휘벅스 120개 모으기',120,50],['new','처음 해 보는 게임 하기',1,30]];
const ATT=[20,30,40,50,60,80,200];
let P=Object.assign({name:'',bux:100,xp:0,av:{head:'#ffd2a8',body:'#f2553c',legs:'#2a3a6a',hat:'none',face:'smile'},hats:['none'],fav:[],recent:[],plays:{},best:{},wins:{},g:{},job:'adv',jobs:['adv'],jxp:{},day:'',launches:0,mday:'',mset:[],mp:{},mdone:[],dset:[],att:{last:'',n:0},seen:[]},store.get('profile',{}));
['g','jxp','wins','best','plays','mp'].forEach(k=>{if(!P[k]||typeof P[k]!=='object')P[k]={}});['jobs','hats','fav','recent','mset','mdone','dset','seen'].forEach(k=>{if(!Array.isArray(P[k]))P[k]=k==='jobs'?['adv']:k==='hats'?['none']:[]});if(!P.att)P.att={last:'',n:0};if(typeof P.xp!=='number')P.xp=0;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const lvOf=xp=>{let l=1,need=100,x=xp;while(x>=need&&l<99){x-=need;l++;need=Math.round(need*1.18)}return{l,x,need}};
const jobOf=()=>JOBS.find(j=>j[0]===P.job)||JOBS[0];
function mods(){const j=jobOf(),lv=lvOf(P.jxp[P.job]||0).l,k=1+(lv-1)*.08,m=j[5];return{coin:1+(m.coin||0)*k,xp:1+(m.xp||0)*k,life:m.life||0,luck:1+(m.luck||0)*k,duel:1+(m.duel||0),jack:(m.jack||0)}}
function save(){store.set('profile',P);$('buxN').textContent=P.bux.toLocaleString();$('lvN').textContent=lvOf(P.xp).l;$('meName').textContent=P.name||'아이디 정하기';drawAvatar($('meCv'),P.av,0,true)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function gain(bux,xp){P.bux+=bux;P.xp+=xp;P.jxp[P.job]=(P.jxp[P.job]||0)+xp;mprog('earn',bux)}

/* ── missions & attendance ── */
function mreset(){if(P.mday===today())return;P.mday=today();const pool=[...MISS];P.mset=[];while(P.mset.length<4){const i=Math.floor(Math.random()*pool.length);P.mset.push(pool.splice(i,1)[0][0])}P.mp={};P.mdone=[];P.dset=[]}
function mprog(k,n=1){mreset();if(!P.mset.includes(k))return;P.mp[k]=(P.mp[k]||0)+n;if($('player').hidden)renderQuick()}
function renderQuick(){mreset();$('missions').innerHTML=P.mset.map(k=>{const m=MISS.find(x=>x[0]===k),v=Math.min(m[2],P.mp[k]||0),done=P.mdone.includes(k),ok=v>=m[2];return`<div class="ms"><span>${m[1]}</span><button class="mini" data-m="${k}" ${done||!ok?'disabled':''}>${done?'받음':ok?'+'+m[3]+' 받기':v+'/'+m[2]}</button><div class="pb"><i style="width:${v/m[2]*100}%"></i></div></div>`}).join('');
  $('missions').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=MISS.find(x=>x[0]===b.dataset.m);if(P.mdone.includes(m[0]))return;P.mdone.push(m[0]);gain(m[3],m[3]);save();toast(`미션 완료 · +${m[3]} 휘벅스`);renderQuick()});
  const a=P.att,can=a.last!==today(),got=can?a.n%7:((a.n-1)%7)+1;$('att').innerHTML=ATT.map((r,i)=>`<div class="${i<got?'got':''} ${can&&i===a.n%7?'now':''}"><span>${i+1}일</span><b>${r}</b></div>`).join('');$('attInfo').textContent=`${a.n}일째`;
  $('attBtn').disabled=!can;$('attBtn').textContent=can?`오늘 받기 · +${ATT[a.n%7]} 휘벅스`:'내일 또 오자';$('attBtn').style.opacity=can?1:.5;
  const j=jobOf(),jl=lvOf(P.jxp[P.job]||0);$('jobBox').innerHTML=`<div class="jobRow"><span class="ic" style="background:${j[2]}">${j[1][0]}</span><div style="flex:1;min-width:0"><b>${j[1]} Lv.${jl.l}</b><div style="font-size:12.5px;color:var(--sub)">${j[3]}</div></div></div><div class="xpb"><i style="width:${jl.x/jl.need*100}%"></i></div><button class="mini" id="jobBtn" style="justify-self:start;padding:7px 12px">직업 바꾸기</button>`;$('jobBtn').onclick=()=>openProfile('job')}
$('attBtn').onclick=()=>{const a=P.att;if(a.last===today())return;const y=new Date(Date.now()-864e5),ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();if(a.last!==ys)a.n=0;const r=ATT[a.n%7];a.n++;a.last=today();gain(r,20);if(a.n%7===0&&!P.hats.includes('top')){P.hats.push('top');toast('7일 출석! 신사 모자 선물')}else toast(`출석 ${a.n}일째 · +${r} 휘벅스`);save();renderQuick()};

/* ── db ranking ── */
let dbP=null;function dbx(){if(dbP)return dbP;dbP=(async()=>{try{if(!window.claude||!claude.use)return null;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return null;const uid=await user.id();return uid?{db,uid}:null}catch(e){return null}})();return dbP}
let pushT=0;function pushRank(){clearTimeout(pushT);pushT=setTimeout(async()=>{const x=await dbx();if(!x||!P.name)return;try{await x.db.doc('hwi/'+x.uid).set({n:P.name.slice(0,12),lv:lvOf(P.xp).l,b:P.best,t:Date.now()})}catch(e){}},1500)}
const AIN=['별똥별','고양이왕','슬라임짱','밤까마귀','두부전사','민트초코','번개토끼','잿빛유령','달빛닌자','곰돌이','파란마녀','로봇7호'];
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
let rankCache=null,rankAt=0;async function allRanks(){if(rankCache&&Date.now()-rankAt<20000)return rankCache;const x=await dbx();const out=[];if(x){try{const q=await x.db.collection('hwi').get();q.docs.forEach(d=>out.push({id:d.id,me:d.id===x.uid,v:d.data()||{}}))}catch(e){}}rankCache=out;rankAt=Date.now();return out}
async function rank(id,par,lower){const out=[];let h=hash(id);const mult=[3.2,2.5,2,1.7,1.4,1.15,.95,.75,.55,.35];AIN.slice(0,10).forEach((n,i)=>{h=Math.imul(h^(i+1),2654435761)>>>0;const j=.85+(h%300)/1000;let s=par*mult[i]*j;if(lower)s=par/(mult[i]*j);out.push({n,s:Math.max(1,Math.round(s)),ai:1})});
  let mine=false;(await allRanks()).forEach(r=>{const s=r.v.b&&r.v.b[id];if(typeof s==='number'){if(r.me){mine=true;out.push({n:P.name,s:P.best[id]??s,me:1})}else out.push({n:String(r.v.n||'?').slice(0,12),s})}});
  if(!mine&&P.best[id]!=null)out.push({n:P.name||'나',s:P.best[id],me:1});out.sort((a,b)=>lower?a.s-b.s:b.s-a.s);return out}

/* ── duel: presence-only matchmaking in a per-game room, AI fallback ── */
let DU=null;
async function findDuel(id){const g=G_(id);closeDuelRoom();$('match').hidden=false;$('matchBox').innerHTML=`<h3>⚔ 듀얼 찾는 중</h3><div class="spin"></div><p>${esc(g.name)} · 같은 판으로 겨룬다<br>8초 안에 사람이 없으면 AI와 붙는다</p><button id="mCancel">취소</button>`;
  let cancelled=false,room=null,done=false;$('mCancel').onclick=()=>{cancelled=true;$('match').hidden=true;try{room&&room.leave()}catch(e){}};
  const seed=(Math.random()*2**31)>>>0;
  const go=(opp,sd,rm)=>{if(done||cancelled)return;done=true;DU={id,seed:sd,opp,room:rm,limit:150,t0:0,me:0,opp_s:0,res:null,lower:!!g.lower,par:g.par||100};$('match').hidden=true;$('matchBox').innerHTML='';mprog('duel');launch(id,true)};
  try{const rp=window.claude&&claude.use?await claude.use('room'):null;if(rp&&!cancelled){room=await rp.join('hwi-d-'+id);const meP=()=>room.peers().find(p=>p.isMe);await room.presence({n:P.name,st:'wait',seed,t:Date.now(),s:0,done:false,with:null});
    const check=()=>{if(done||cancelled)return;const me=meP();if(!me)return;const ps=room.peers().filter(p=>!p.isMe);
      const inv=ps.find(p=>p.presence.st==='play'&&p.presence.with===me.peer);if(inv){room.presence({st:'play',with:inv.peer,seed:inv.presence.seed,s:0,done:false}).catch(()=>{});return go({n:String(inv.presence.n||'상대').slice(0,12),peer:inv.peer},inv.presence.seed>>>0,room)}
      const w=ps.filter(p=>p.presence.st==='wait').sort((a,b)=>a.peer<b.peer?-1:1)[0];if(w&&me.peer<w.peer){room.presence({st:'play',with:w.peer,seed,s:0,done:false}).catch(()=>{});go({n:String(w.presence.n||'상대').slice(0,12),peer:w.peer},seed,room)}};
    room.onPeers(()=>check());setTimeout(check,600)}}catch(e){room=null}
  setTimeout(()=>{if(done||cancelled)return;try{room&&room.leave()}catch(e){}const n=AIN[Math.floor(Math.random()*AIN.length)];go({n,ai:1,target:null},seed,null)},8000)}
function closeDuelRoom(){if(DU&&DU.room){try{DU.room.leave()}catch(e){}}DU=null}
function duelLive(id,s){if(!DU||DU.id!==id)return;if(!DU.t0)DU.t0=performance.now();DU.me=s;if(DU.room&&!DU.meDone)DU.room.presence({s,done:false}).catch(()=>{})}
function duelState(){if(!DU)return null;if(!DU.t0)DU.t0=performance.now();const el=(performance.now()-DU.t0)/1000;
  if(DU.opp.ai){if(DU.opp.target==null){const b=P.best[DU.id],par=DU.par;let t=(b!=null&&b>0)?b*(.75+Math.random()*.5):par*(.7+Math.random()*.8);DU.opp.target=Math.max(1,Math.round(t))}DU.opp_s=DU.lower?(DU.res?DU.opp.target:0):(DU.res?DU.opp.target:Math.round(DU.opp.target*Math.min(1,el/(DU.limit*.7))))}
  else if(DU.room){const p=DU.room.peers().find(x=>x.peer===DU.opp.peer);if(p){DU.opp_s=+p.presence.s||0;DU.oppDone=!!p.presence.done}else DU.oppGone=true}
  if(DU.meDone&&!DU.res&&(DU.opp.ai||DU.oppDone||DU.oppGone||el>DU.limit+30)){const a=DU.me,b=DU.opp_s,forfeit=!DU.opp.ai&&!DU.oppDone;const better=forfeit||(DU.lower?a<b:a>b);DU.res=(!forfeit&&a===b)?'draw':better?'win':'lose';if(DU.opp.ai)DU.opp_s=DU.opp.target;const m=mods();DU.reward=Math.round((DU.res==='win'?30:DU.res==='draw'?10:5)*m.duel);gain(DU.reward,DU.reward);if(DU.res==='win')P.wins.duel=(P.wins.duel||0)+1;save()}
  return{opp:DU.opp_s,me:DU.me,res:DU.res,reward:DU.reward}}

/* ── platform API read by every game (kit.js) ── */
const gd=id=>P.g[id]||(P.g[id]={ups:{},skins:[],skin:null,best:null,plays:0});
window.hwiApi={
  me:()=>{const j=jobOf();return{name:P.name||'플레이어',bux:P.bux,job:j[0],jobName:j[1],jobLv:lvOf(P.jxp[P.job]||0).l,av:P.av}},
  game:id=>{const g=gd(id);g.best=P.best[id]??null;g.plays=P.plays[id]||0;return g},mods,
  buy(id,kind,item,cost){if(P.bux<cost)return{ok:false,bux:P.bux};P.bux-=cost;const g=gd(id);if(kind==='up')g.ups[item]=(g.ups[item]||0)+1;else{if(!g.skins.includes(item))g.skins.push(item);g.skin=item}save();return{ok:true,bux:P.bux}},
  equip(id,item){gd(id).skin=item;save()},
  score(id,sc,won,lower,par){sc=+sc||0;par=par||100;const old=P.best[id];const nb=old==null||(lower?sc<old:sc>old);if(nb&&(sc>0||lower)){P.best[id]=sc;if(old!=null)mprog('best');pushRank()}if(won)P.wins[id]=(P.wins[id]||0)+1;
    const m=mods();let base=lower?(sc>0?par/sc*15:1):sc/par*15;let rw=Math.max(2,Math.min(45,Math.round(base)))+(won?5:0);rw=Math.round(rw*m.coin);if(Math.random()<m.jack){rw*=2;setTimeout(()=>toast('도박사 대박! 보상 2배'),300)}
    const xp=Math.round((10+rw)*m.xp),before=lvOf(P.xp).l;gain(rw,xp);const after=lvOf(P.xp).l;if(after>before){P.bux+=after*10;setTimeout(()=>toast(`휘블록스 레벨 ${after}! +${after*10} 휘벅스`),600)}
    if(DU&&DU.id===id&&!DU.meDone){DU.me=sc;DU.meDone=true;DU.lower=lower;DU.par=par;if(DU.room)DU.room.presence({s:sc,done:true}).catch(()=>{})}save();return{reward:rw,xp,newBest:nb&&old!=null,best:P.best[id]??sc,lvUp:after>before?after:0}},
  live:(id,s)=>duelLive(id,s),duel:()=>DU&&cur&&DU.id===cur.id?{seed:DU.seed,opp:DU.opp,limit:DU.limit}:null,duelState,
  findDuel:id=>{findDuel(id)},rank,exit:()=>closePlayer()};

/* ── drawing: avatars and big-game covers ── */
function rr(c,x,y,w,h,r,col){c.fillStyle=col;c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);c.fill()}
function ci(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function blocky(c,x,y,s,av,t=0){const b=Math.sin(t*3)*1.5*s;rr(c,x-14*s,y-6*s,12*s,26*s,3*s,av.legs);rr(c,x+2*s,y-6*s,12*s,26*s,3*s,av.legs);rr(c,x-18*s,y-38*s+b,36*s,34*s,5*s,av.body);rr(c,x-28*s,y-36*s+b,9*s,28*s,4*s,av.head);rr(c,x+19*s,y-36*s+b,9*s,28*s,4*s,av.head);
  rr(c,x-15*s,y-68*s+b,30*s,30*s,7*s,av.head);const ey=y-56*s+b;
  if(av.face==='cool'){rr(c,x-12*s,ey-3*s,24*s,7*s,3*s,'#14182b')}else if(av.face==='wink'){ci(c,x-6*s,ey,2.5*s,'#14182b');c.strokeStyle='#14182b';c.lineWidth=2*s;c.beginPath();c.moveTo(x+3*s,ey);c.lineTo(x+9*s,ey);c.stroke()}else{ci(c,x-6*s,ey,2.5*s,'#14182b');ci(c,x+6*s,ey,2.5*s,'#14182b')}
  c.strokeStyle='#14182b';c.lineWidth=2*s;c.beginPath();c.arc(x,ey+5*s,5*s,.25,Math.PI-.25);c.stroke();
  const hy=y-68*s+b;if(av.hat==='cap'){rr(c,x-16*s,hy-4*s,32*s,10*s,4*s,'#3aa0ff');rr(c,x+4*s,hy+3*s,18*s,4*s,2*s,'#3aa0ff')}
  if(av.hat==='crown'){c.fillStyle='#ffc531';c.beginPath();c.moveTo(x-14*s,hy+2*s);c.lineTo(x-14*s,hy-12*s);c.lineTo(x-7*s,hy-5*s);c.lineTo(x,hy-14*s);c.lineTo(x+7*s,hy-5*s);c.lineTo(x+14*s,hy-12*s);c.lineTo(x+14*s,hy+2*s);c.fill()}
  if(av.hat==='wizard'){c.fillStyle='#6a4cff';c.beginPath();c.moveTo(x-18*s,hy+3*s);c.lineTo(x+18*s,hy+3*s);c.lineTo(x+4*s,hy-30*s);c.fill();ci(c,x+2*s,hy-12*s,2.5*s,'#ffc531')}
  if(av.hat==='phones'){c.strokeStyle='#14182b';c.lineWidth=4*s;c.beginPath();c.arc(x,hy+12*s,17*s,Math.PI*1.05,Math.PI*1.95);c.stroke();rr(c,x-19*s,hy+8*s,7*s,12*s,3*s,'#f2553c');rr(c,x+12*s,hy+8*s,7*s,12*s,3*s,'#f2553c')}
  if(av.hat==='horns'){c.fillStyle='#d8d2c4';[-1,1].forEach(d=>{c.beginPath();c.moveTo(x+d*8*s,hy+2*s);c.lineTo(x+d*18*s,hy-14*s);c.lineTo(x+d*14*s,hy+4*s);c.fill()})}
  if(av.hat==='halo'){c.strokeStyle='#ffc531';c.lineWidth=3*s;c.beginPath();c.ellipse(x,hy-8*s,13*s,4*s,0,0,Math.PI*2);c.stroke()}
  if(av.hat==='band'){rr(c,x-16*s,hy+4*s,32*s,5*s,2*s,'#ff6ad5');ci(c,x+10*s,hy+4*s,5*s,'#ff6ad5')}
  if(av.hat==='top'){rr(c,x-18*s,hy,36*s,5*s,2*s,'#14182b');rr(c,x-11*s,hy-20*s,22*s,22*s,3*s,'#14182b');rr(c,x-11*s,hy-6*s,22*s,4*s,0,'#f2553c')}}
function drawAvatar(cv,av,t,small){const c=cv.getContext('2d'),w=cv.width,h=cv.height;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,w,h);blocky(c,w/2,h*(small?.96:.86),w/(small?84:120),av,t)}
function bigCover(id,cv,t){const c=cv.getContext('2d'),W=cv.width,H=cv.height;let g;const sky=(a,b)=>{g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,0,W,H)};
  if(id==='ash'){sky('#1b1a1f','#2a262c');rr(c,W*.18,H*.15,W*.2,H*.32,2,'#2f3640');rr(c,W*.62,H*.15,W*.2,H*.32,2,'#2f3640');c.fillStyle='#0d0c0f';c.fillRect(0,H*.62,W,H);rr(c,W*.42,H*.3,W*.16,H*.45,3,'#3a3a3e');ci(c,W*.5,H*.5,W*.03,'#777');
    c.save();c.translate(W*.78,H*.75);c.rotate(.15+Math.sin(t)*.03);rr(c,-W*.05,-H*.5,W*.1,H*.42,W*.04,'#08080a');rr(c,-W*.03,-H*.6,W*.06,H*.14,W*.03,'#08080a');ci(c,-W*.012,-H*.55,W*.006,'#d9d2c5');c.restore();g=c.createRadialGradient(W*.5,0,0,W*.5,0,W*.7);g.addColorStop(0,'rgba(255,200,140,.18)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H)}
  if(id==='sprout'){sky('#7ec8ff','#d8f4c8');c.fillStyle='#5fbf5a';c.beginPath();c.moveTo(0,H*.62);for(let x=0;x<=W;x+=W/8)c.lineTo(x,H*.6+Math.sin(x*.02+t*.5)*H*.03);c.lineTo(W,H);c.lineTo(0,H);c.fill();
    [[.12,.22,.18],[.3,.16,.24],[.74,.2,.2],[.88,.26,.16]].forEach(([x,w,h])=>{rr(c,W*x-W*w/4,H*(.6-h),W*w/2,H*h,3,'#e8e4dc');for(let i=0;i<4;i++)for(let j=0;j<3;j++){c.fillStyle=(i+j+Math.floor(t))%3?'#8fc8f0':'#ffe9a8';c.fillRect(W*x-W*w/4+6+j*W*w/7,H*(.6-h)+6+i*H*h/4.5,W*w/12,H*h/9)}});
    const hx=W*.5,hy=H*.62+Math.sin(t*3)*2;rr(c,hx-14,hy-46,28,34,8,'#3b6ea5');ci(c,hx,hy-56,13,'#f2c9a0');c.fillStyle='#3a2414';c.beginPath();c.arc(hx,hy-60,13,Math.PI,0);c.fill();c.save();c.translate(hx+16,hy-34);c.rotate(-.6+Math.sin(t*3)*.3);rr(c,-2,-34,5,34,2,'#dfe8f0');c.restore();
    [[.36,'#ff9ad5'],[.64,'#9dff7a']].forEach(([x,col],k)=>{const px=W*x,py=H*.64+Math.sin(t*3+k)*2;rr(c,px-11,py-38,22,28,7,col);ci(c,px,py-46,10,'#f2c9a0');c.fillStyle='rgba(0,0,0,.55)';rr(c,px-24,py-74,48,14,7,'rgba(0,0,0,.55)');c.fillStyle='#fff';c.font=`bold ${Math.round(H*.05)}px sans-serif`;c.textAlign='center';c.fillText(k?'💚친구':'🎉파티',px,py-63)});
    c.fillStyle='#fff';c.strokeStyle='#2a5a2a';c.lineWidth=H*.02;c.font=`${Math.round(H*.15)}px "Black Han Sans",sans-serif`;c.textAlign='center';c.strokeText('새싹 모험기',W/2,H*.22);c.fillText('새싹 모험기',W/2,H*.22);c.font=`bold ${Math.round(H*.06)}px sans-serif`;c.fillStyle='#2a5a2a';c.fillText('🌐 멀티플레이 서버 오픈',W/2,H*.32)}
  if(id==='duel'){sky('#2a1a3a','#140f1a');for(let i=0;i<16;i++){c.save();c.translate(W/2,H*.55);c.rotate(i*Math.PI/8+t*.2);c.fillStyle='rgba(226,184,79,.12)';c.beginPath();c.moveTo(0,0);c.lineTo(W,-20);c.lineTo(W,20);c.fill();c.restore()}
    [[.28,'#d8d2c4'],[.5,'#8e2f2a'],[.72,'#2a5a3a']].forEach(([x,col])=>{const s=H/120;rr(c,W*x-10*s,H*.5,20*s,32*s,6*s,col);ci(c,W*x,H*.42,11*s,'#d9d2c5');ci(c,W*x+3*s,H*.42,1.6*s,'#121115')});c.fillStyle='#ffd27a';c.font=`${Math.round(H*.14)}px "Black Han Sans",sans-serif`;c.textAlign='center';c.fillText('★★★★★',W/2,H*.2)}}
const art=(g,w,h,cls='')=>g.big?`<canvas class="${cls}" width="${w}" height="${h}" data-c="${g.id}"></canvas>`:`<img class="${cls}" src="${g.id}.jpg" alt="" loading="lazy">`;
function paintCovers(root=document){root.querySelectorAll('canvas[data-c]').forEach(cv=>bigCover(cv.dataset.c,cv,0))}

/* ── home ── */
const FEAT=['sprout','ash',...GAMES.filter(g=>g.feat).map(g=>g.id)].slice(0,8);let feat=0,featT=0,cat='all';
function renderHero(){const g=G_(FEAT[feat]);$('heroTag').textContent=CATS[g.cat][0];$('heroTag').style.background=CATS[g.cat][1];$('heroName').textContent=g.name;$('heroDesc').textContent=g.desc;$('heroPlay').onclick=()=>launch(g.id);$('heroArt').innerHTML=art(g,640,400);
  $('dots').innerHTML=FEAT.map((f,i)=>`<button class="${i===feat?'on':''}" data-i="${i}" aria-label="${esc(G_(f).name)}"></button>`).join('');$('dots').querySelectorAll('button').forEach(b=>b.onclick=()=>{feat=+b.dataset.i;featT=0;renderHero()})}
const fmtS=(g,s)=>s==null?'-':g.fmt==='time'?`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`:g.fmt==='win'?(s?'승리':'-'):Math.round(s).toLocaleString()+(g.unit||'');
function bestText(g){const b=P.best[g.id];if(g.big)return P.plays[g.id]?`${P.plays[g.id]}번 플레이`:'';if(b==null)return P.plays[g.id]?`${P.plays[g.id]}판`:'';return'최고 '+fmtS(g,b)}
function tile(g){return`<button class="tile" data-g="${g.id}">${art(g,336,252)}${!P.plays[g.id]&&!g.big?'<span class="new">NEW</span>':''}${g.d3||g.id==='ash'||g.id==='sprout'?'<span class="new" style="left:auto;right:8px;background:#6a4cff">3D</span>':''}<span class="meta"><b>${esc(g.name)}${P.fav.includes(g.id)?' ♥':''}</b><span class="row"><span class="tag" style="background:${CATS[g.cat][1]}">${CATS[g.cat][0]}</span><span class="best">${bestText(g)}</span></span></span></button>`}
function renderShelves(){const q=$('q').value.trim();$('chips').innerHTML=[['all','전체 '+GAMES.length],...Object.entries(CATS).filter(([k])=>GAMES.some(g=>g.cat===k)).map(([k,v])=>[k,v[0]+' '+GAMES.filter(g=>g.cat===k).length])].map(([k,n])=>`<button class="chip${cat===k?' on':''}" data-k="${k}">${n}</button>`).join('');$('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.k;renderShelves()});
  const list=GAMES.filter(g=>(cat==='all'||g.cat===cat)&&(!q||g.name.includes(q)||CATS[g.cat][0].includes(q)||(g.desc||'').includes(q)));let html='';
  if(q){html=`<section class="shelf"><h2>‘${esc(q)}’ 찾기<small>${list.length}개</small></h2>${list.length?`<div class="grid">${list.map(tile).join('')}</div>`:'<p class="empty">찾는 게임이 없다. 다른 말로 찾아보자.</p>'}</section>`}
  else{if(cat==='all'){const rec=P.recent.map(G_).filter(Boolean).slice(0,6),fav=P.fav.map(G_).filter(Boolean);if(rec.length)html+=`<section class="shelf"><h2>이어서 하기</h2><div class="grid">${rec.map(tile).join('')}</div></section>`;if(fav.length)html+=`<section class="shelf"><h2>즐겨찾기</h2><div class="grid">${fav.map(tile).join('')}</div></section>`}
    Object.entries(CATS).filter(([k])=>cat==='all'||k===cat).forEach(([k,[n]])=>{const gs=GAMES.filter(g=>g.cat===k);if(gs.length)html+=`<section class="shelf"><h2>${n}<small>${gs.length}개</small></h2><div class="grid">${gs.map(tile).join('')}</div></section>`})}
  $('shelves').innerHTML=html;$('shelves').querySelectorAll('.tile').forEach(b=>b.onclick=()=>openDetail(b.dataset.g));paintCovers($('shelves'))}
$('q').addEventListener('input',renderShelves);$('logo').onclick=()=>{$('q').value='';cat='all';renderShelves();scrollTo(0,0)};

/* ── detail ── */
async function openDetail(id,tab='info'){const g=G_(id);$('detail').hidden=false;const fav=P.fav.includes(id),gg=gd(id);
  $('detailBox').innerHTML=`${art(g,640,360,'cover')}<div class="mbody"><span class="tag" style="background:${CATS[g.cat][1]};justify-self:start">${CATS[g.cat][0]}</span><h3>${esc(g.name)}</h3><div class="tabs"><button data-t="info" class="${tab==='info'?'on':''}">소개</button>${g.big?'':`<button data-t="rank" class="${tab==='rank'?'on':''}">랭킹</button>`}</div><div id="dtab"></div>
  <div class="btns"><button class="play" id="dPlay">플레이</button>${g.big||g.duel===false?'':'<button class="ghost" id="dDuel">⚔ 듀얼</button>'}<button class="ghost" id="dFav">${fav?'♥ 해제':'♡ 즐겨찾기'}</button><button class="ghost" id="dClose">닫기</button></div></div>`;
  paintCovers($('detailBox'));$('detailBox').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>openDetail(id,b.dataset.t));
  $('dPlay').onclick=()=>{$('detail').hidden=true;launch(id)};$('dClose').onclick=()=>$('detail').hidden=true;$('dFav').onclick=()=>{P.fav=fav?P.fav.filter(x=>x!==id):[...P.fav,id];save();openDetail(id,tab);renderShelves()};const dd=$('dDuel');if(dd)dd.onclick=()=>{$('detail').hidden=true;if(!P.name)return askName(()=>findDuel(id));findDuel(id)};
  if(tab==='info')$('dtab').innerHTML=`<p>${esc(g.desc)}</p>${g.how?`<p><b>조작</b> · ${esc(g.how)}</p>`:''}${g.big?'':`<p><b>들어 있는 것</b> · 상점(강화·스킨) · 랭킹 · 듀얼 · 직업 효과${g.feats?' · '+esc(g.feats):''}</p>`}<div class="stats"><div><span>플레이</span>${P.plays[id]||0}번</div><div><span>최고 기록</span>${g.big?'-':fmtS(g,P.best[id])}</div><div><span>강화·스킨</span>${Object.values(gg.ups||{}).reduce((a,b)=>a+b,0)} · ${(gg.skins||[]).length}</div></div>`;
  else{$('dtab').innerHTML='<p>불러오는 중…</p>';const L=await rank(id,g.par||100,!!g.lower);if(!$('dtab'))return;$('dtab').innerHTML=`<div style="display:grid;gap:5px;max-height:300px;overflow:auto">${L.slice(0,30).map((r,i)=>`<div class="rk${r.me?' me':''}"><span class="no">${i+1}</span><span>${esc(r.n)}${r.ai?'<em>AI</em>':''}</span><span class="sc">${fmtS(g,r.s)}</span></div>`).join('')}</div>`}}
$('detail').addEventListener('click',e=>{if(e.target===$('detail'))$('detail').hidden=true});

/* ── player ── */
let cur=null;
async function launch(id,isDuel){const g=G_(id);if(!P.name){askName(()=>launch(id,isDuel));return}if(!isDuel&&DU)closeDuelRoom();cur=g;mreset();P.recent=[id,...P.recent.filter(x=>x!==id)].slice(0,8);if(!P.plays[id])mprog('new');P.plays[id]=(P.plays[id]||0)+1;mprog('play');
  if(!P.dset.includes(id)){P.dset.push(id);mprog('diff')}
  if(P.day!==today()){P.day=today();P.launches=0}if(g.big&&P.launches<10){P.launches++;gain(5,10);toast(`${g.name} · +5 휘벅스`)}save();
  $('player').hidden=false;$('pbar').hidden=!g.big;$('pName').textContent=g.name;document.body.style.overflow='hidden';const fr=$('frame');fr.removeAttribute('src');fr.srcdoc='<body style="background:#000;color:#999;font-family:sans-serif;display:grid;place-items:center;height:100vh;margin:0">불러오는 중…</body>';
  const src=g.big?g.file:`${g.id}.html`;
  try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);const r=await fetch(src,{cache:'no-store',signal:ctl.signal});clearTimeout(to);if(!r.ok)throw 0;let html=await r.text();const pre='<script>try{window.claude=parent.claude}catch(e){}<\/script>';
    if(!/^\s*<!doctype/i.test(html))html='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>'+pre+html+'</body></html>';else html=html.replace(/<head>/i,'<head>'+pre);
    if(cur===g)fr.srcdoc=html}catch(e){if(cur===g){fr.removeAttribute('srcdoc');fr.src=src}}}
function closePlayer(){$('player').hidden=true;const fr=$('frame');fr.removeAttribute('src');fr.srcdoc='';cur=null;closeDuelRoom();document.body.style.overflow='';renderShelves();renderQuick()}
$('pBack').onclick=closePlayer;
addEventListener('message',e=>{if(e.source!==$('frame').contentWindow)return;const d=e.data||{};if(d.hwi==='exit')closePlayer()});

/* ── profile, avatar, jobs ── */
function openProfile(tab='me'){$('profile').hidden=false;renderProfile(tab)}
function renderProfile(tab){const av=P.av,plays=Object.values(P.plays).reduce((a,b)=>a+b,0),L=lvOf(P.xp);
  let body='';if(tab==='me')body=`<div class="avatarBox"><canvas id="avCv" width="300" height="300"></canvas><div style="display:grid;gap:10px">
  <label class="lab" for="nameIn">아이디</label><div class="btns"><input id="nameIn" maxlength="12" value="${esc(P.name)}" placeholder="2~12자" style="flex:1;min-width:0;background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:9px 12px"><button class="ghost" id="nameOk">저장</button></div>
  ${[['head','얼굴·팔'],['body','몸'],['legs','다리']].map(([k,n])=>`<div class="lab">${n}</div><div class="sw" data-p="${k}">${PAL.map(c=>`<button style="background:${c}" data-c="${c}" class="${av[k]===c?'on':''}" aria-label="${n} 색"></button>`).join('')}</div>`).join('')}
  <div class="lab">표정</div><div class="tabs">${[['smile','웃음'],['wink','윙크'],['cool','선글라스']].map(([k,n])=>`<button class="${av.face===k?'on':''}" data-face="${k}">${n}</button>`).join('')}</div></div></div>
  <div class="lab">모자 · 휘벅스로 산다</div><div class="hats">${HATS.map(([k,n,p])=>{const own=P.hats.includes(k);return`<button class="${av.hat===k?'on':''}" data-hat="${k}"><b>${n}</b><small>${own?(av.hat===k?'쓰는 중':'가짐'):p+' 휘벅스'}</small></button>`}).join('')}</div>
  <div class="stats"><div><span>레벨</span>${L.l}</div><div><span>총 플레이</span>${plays}번</div><div><span>듀얼 승리</span>${P.wins.duel||0}</div></div>`;
  else if(tab==='job')body=`<p>직업은 모든 게임에 효과가 있다. 직업마다 레벨이 따로 오르고, 레벨이 오를수록 효과가 세진다.</p><div class="jobs">${JOBS.map(([k,n,col,d,p])=>{const own=P.jobs.includes(k),lv=lvOf(P.jxp[k]||0).l;return`<button class="${P.job===k?'on':''}" data-job="${k}"><b style="color:${col}">${n}${own?' Lv.'+lv:''}</b><small>${d}</small><small>${P.job===k?'지금 직업':own?'바꾸기':p+' 휘벅스'}</small></button>`}).join('')}</div>`;
  else body='<p id="lvRank">불러오는 중…</p>';
  $('profileBox').innerHTML=`<h3>내 휘블록스</h3><div class="tabs"><button data-pt="me" class="${tab==='me'?'on':''}">캐릭터</button><button data-pt="job" class="${tab==='job'?'on':''}">직업</button><button data-pt="rank" class="${tab==='rank'?'on':''}">레벨 랭킹</button></div>${body}<div class="btns"><button class="ghost" id="pClose">닫기</button></div>`;
  $('profileBox').querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>renderProfile(b.dataset.pt));$('pClose').onclick=()=>$('profile').hidden=true;
  if(tab==='me'){$('nameOk').onclick=()=>{const v=$('nameIn').value.trim().replace(/[^\p{L}\p{N}_\-]/gu,'');if(v.length<2){toast('아이디는 2자 이상');return}P.name=v.slice(0,12);save();pushRank();toast('아이디를 저장했다')};
    $('profileBox').querySelectorAll('.sw').forEach(w=>w.querySelectorAll('button').forEach(b=>b.onclick=()=>{P.av[w.dataset.p]=b.dataset.c;save();renderProfile('me')}));
    $('profileBox').querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{P.av.face=b.dataset.face;save();renderProfile('me')});
    $('profileBox').querySelectorAll('[data-hat]').forEach(b=>b.onclick=()=>{const [k,n,p]=HATS.find(h=>h[0]===b.dataset.hat);if(!P.hats.includes(k)){if(P.bux<p){toast(`휘벅스가 ${p-P.bux}개 모자라다`);return}P.bux-=p;P.hats.push(k);toast(`${n}을(를) 샀다`)}P.av.hat=k;save();renderProfile('me')})}
  if(tab==='job')$('profileBox').querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{const j=JOBS.find(x=>x[0]===b.dataset.job);if(!P.jobs.includes(j[0])){if(P.bux<j[4]){toast(`휘벅스가 ${j[4]-P.bux}개 모자라다`);return}P.bux-=j[4];P.jobs.push(j[0]);toast(`${j[1]} 직업을 얻었다!`)}P.job=j[0];save();renderQuick();renderProfile('job')});
  if(tab==='rank')(async()=>{const out=AIN.map((n,i)=>({n,s:Math.max(1,30-i*3+(hash(n)%3)),ai:1}));let mine=false;(await allRanks()).forEach(r=>{if(typeof r.v.lv==='number'){if(r.me){mine=true;out.push({n:P.name,s:L.l,me:1})}else out.push({n:String(r.v.n||'?').slice(0,12),s:r.v.lv})}});if(!mine)out.push({n:P.name||'나',s:L.l,me:1});out.sort((a,b)=>b.s-a.s);
    const box=$('lvRank');if(box)box.outerHTML=`<div style="display:grid;gap:5px;max-height:340px;overflow:auto">${out.slice(0,40).map((r,i)=>`<div class="rk${r.me?' me':''}"><span class="no">${i+1}</span><span>${esc(r.n)}${r.ai?'<em>AI</em>':''}</span><span class="sc">Lv.${r.s}</span></div>`).join('')}</div>`})()}
function askName(then){$('profile').hidden=false;$('profileBox').innerHTML=`<h3>휘블록스에 온 걸 환영해!</h3><p>게임에서 쓸 아이디를 정한다. 랭킹과 듀얼에 이 이름이 나온다. 나중에 오른쪽 위 내 캐릭터를 눌러 바꿀 수 있다. 처음 온 기념으로 휘벅스 100개!</p><input id="firstName" maxlength="12" placeholder="2~12자" autocomplete="off" style="background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:11px 14px"><button class="play" id="firstOk">시작하기</button>`;
  const go=()=>{const v=$('firstName').value.trim().replace(/[^\p{L}\p{N}_\-]/gu,'');if(v.length<2){toast('아이디는 2자 이상');return}P.name=v.slice(0,12);save();pushRank();$('profile').hidden=true;if(then)then()};$('firstOk').onclick=go;$('firstName').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>$('firstName').focus(),30)}
$('meBtn').onclick=()=>P.name?openProfile():askName();$('profile').addEventListener('click',e=>{if(e.target===$('profile')&&P.name)$('profile').hidden=true});

/* ── loop ── */
function frame(now){const t=now/1000;if($('player').hidden){featT+=1/60;if(featT>7){featT=0;feat=(feat+1)%FEAT.length;renderHero()}const hc=$('heroArt').querySelector('canvas');if(hc)bigCover(hc.dataset.c,hc,t);const av=$('avCv');if(av&&!$('profile').hidden)drawAvatar(av,P.av,t)}requestAnimationFrame(frame)}
save();renderHero();renderShelves();renderQuick();requestAnimationFrame(frame);if(!P.name)setTimeout(()=>askName(),400);else pushRank();
</script>

</body>
