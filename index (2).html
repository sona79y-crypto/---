<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>잿빛 저택 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: full-bleed first-person view; HUD strip inset along the top, touch controls in the bottom corners, centered overlay cards. One deliberate monochrome look. */
:root{
  --black:#050505; --red:#c2141b; --ash:#151514; --smoke:#2c2b29; --bone:#d9d6cf; --dim:#8a8781; --white:#f2f0ea;
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--black);color:var(--bone);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--black);touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;filter:grayscale(1) contrast(1.18) brightness(1.05)}
#cv.inv{filter:grayscale(1) invert(1) contrast(2)}
#grain{position:absolute;inset:0;width:100%;height:100%;opacity:.04;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;--va:.55;--vr:38%;background:radial-gradient(ellipse at center,transparent var(--vr),rgba(0,0,0,var(--va)) 75%,#000 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#slats{position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(to bottom,rgba(0,0,0,.92) 0 8px,rgba(0,0,0,.05) 8px 19px,rgba(0,0,0,.92) 19px 22px),
  linear-gradient(to right,#000 0 4%,transparent 4% 49.6%,#000 49.6% 50.4%,transparent 50.4% 96%,#000 96%)}
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--dim);
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;text-shadow:0 0 6px #000}
#hud .grp{display:flex;align-items:center;gap:6px}
#hud .lbl{font-size:11px;letter-spacing:.14em}
.keyslot{width:13px;height:13px;border:1.5px solid var(--dim);border-radius:50%}
.keyslot.on{background:var(--white);border-color:var(--white)}
.code{display:flex;gap:4px}
.code span{width:18px;height:22px;border-bottom:1.5px solid var(--dim);display:grid;place-items:center;color:var(--white);font-variant-numeric:tabular-nums;font-weight:600}
.bar{width:64px;height:5px;background:var(--smoke);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bone);width:100%}
.hearts{color:var(--white);letter-spacing:2px;font-size:15px}.hearts s{color:#444;text-decoration:none}
#clock{margin-left:auto;font-variant-numeric:tabular-nums;pointer-events:auto}
#bMenu{pointer-events:auto;font:600 15px var(--body);background:rgba(0,0,0,.4);color:var(--bone);border:1px solid #444;border-radius:4px;padding:2px 9px;cursor:pointer}
body.mobbig .ctl button{width:84px;height:84px;font-size:15px}
body.mobbig #hud{font-size:15px;gap:18px}body.mobbig .bar{width:80px;height:7px}
body.mobbig #joy{width:150px;height:150px;margin:-75px 0 0 -75px}body.mobbig #joy i{width:60px;height:60px;margin:-30px}
body.mobbig #hotbar button{width:70px;height:56px;font-size:12px}
#joyHint{position:absolute;left:max(40px,env(safe-area-inset-left,0px));bottom:max(40px,env(safe-area-inset-bottom,0px));width:120px;height:120px;border:1px dashed #444;border-radius:50%;pointer-events:none;display:grid;place-items:center;font-size:11px;color:var(--dim)}
#chPop{position:absolute;inset:0;z-index:12;background:rgba(0,0,0,.6);display:grid;place-items:center;padding-inline:16px}
#chPop>div{background:#0b0b0b;border:1px solid #444;border-radius:6px;padding:16px;display:grid;gap:10px;width:min(340px,100%);text-align:center}
#chPop b{font-family:var(--serif);font-size:20px;color:var(--white)}
#chPop button{font:600 15px var(--body);background:#151515;color:var(--bone);border:1px solid #444;border-radius:4px;padding:12px;cursor:pointer;text-align:left}
#chPop button:hover,#chPop button:focus-visible{border-color:var(--white);outline:none}#chPop button[disabled]{opacity:.55;cursor:default}
#chPop button span{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:3px}
#dancePop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;background:rgba(8,8,8,.92);border:1px solid #444;border-radius:6px;padding:14px;display:grid;gap:8px;width:min(300px,86%);text-align:center;max-height:82vh;overflow:auto;pointer-events:auto}
.touchmode #dancePop{grid-template-columns:1fr 1fr;width:min(420px,92%)}.touchmode #dancePop b,.touchmode #dancePop .small,.touchmode #dancePop [data-dc]{grid-column:1/-1}.touchmode #dancePop button{padding:14px 10px;text-align:center}
#dancePop b{font-family:var(--serif);color:var(--white);font-size:18px}
#dancePop button{font:600 14px var(--body);background:#151515;color:var(--bone);border:1px solid #444;border-radius:4px;padding:10px;cursor:pointer;text-align:left}
#dancePop button:hover,#dancePop button:focus-visible{border-color:var(--white);outline:none}
#dancePop .small{font-size:12px;color:var(--dim)}
#hotbar{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;z-index:3}
#hotbar[hidden]{display:none}
#hotbar button{position:relative;width:62px;height:54px;background:rgba(10,10,10,.72);border:1px solid #3a3a3a;border-radius:4px;color:var(--bone);font:600 11px var(--body);display:grid;place-items:center;padding:14px 2px 2px;cursor:pointer}
#hotbar button i{position:absolute;left:5px;top:3px;font-style:normal;font-size:10px;color:var(--dim)}
#hotbar button b{position:absolute;right:5px;top:3px;font-size:11px;color:var(--white)}
#hotbar button.sel{border-color:var(--white);background:rgba(60,60,60,.8)}
#hotbar button.empty{opacity:.35}
.touchmode #hotbar{left:max(12px,env(safe-area-inset-left,0px));transform:none;bottom:auto;top:96px;flex-direction:column}
.touchmode #hotbar button{width:58px;height:46px}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(240,240,240,.55);pointer-events:none}
#msg{position:absolute;left:0;right:0;top:16%;text-align:center;font-family:var(--serif);font-size:clamp(16px,3.6vw,22px);color:var(--white);opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 0 12px #000,0 0 3px #000;padding-inline:16px}
#prompt{position:absolute;left:50%;top:calc(50% + 34px);transform:translateX(-50%);font-size:13px;background:rgba(0,0,0,.65);border:1px solid var(--smoke);padding:6px 12px;border-radius:4px;color:var(--white);pointer-events:none;white-space:nowrap}
#prog{position:absolute;left:50%;top:calc(50% + 70px);transform:translateX(-50%);width:140px;height:4px;background:var(--smoke)}
#prog i{display:block;height:100%;background:var(--white);width:0}
#stop{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(80px,24vw,220px)/1 Impact,"Arial Black",sans-serif;color:#e00000;text-shadow:0 0 30px rgba(255,0,0,.6),6px 6px 0 #000;opacity:0;pointer-events:none;z-index:4;letter-spacing:.04em}
#stop.on{opacity:1;animation:stopj .08s steps(2) infinite}@keyframes stopj{50%{transform:translate(4px,-3px) scale(1.02)}}
#rhythm{position:absolute;inset:0;z-index:7;background:rgba(0,0,0,.25)}
#rhythm .rtop{position:absolute;top:70px;left:0;right:0;text-align:center;color:var(--white);font-size:14px;text-shadow:0 0 8px #000;margin:0;padding-inline:16px}
.rc{position:absolute;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;border:3px solid var(--white);background:rgba(10,10,10,.6);color:var(--white);font:800 26px var(--body);cursor:pointer;touch-action:none}
.rc i{position:absolute;inset:-3px;border-radius:50%;border:3px solid rgba(255,255,255,.75);animation:ring linear forwards;pointer-events:none}
@keyframes ring{from{transform:scale(2.2)}to{transform:scale(.6);opacity:.2}}
#whiteout{position:absolute;inset:0;background:#f4f2ee;opacity:0;pointer-events:none;z-index:4}
#endtxt{position:absolute;left:0;right:0;bottom:18%;text-align:center;font-family:var(--serif);font-weight:800;font-size:clamp(18px,3.6vw,28px);color:var(--white);text-shadow:0 0 14px #000;opacity:0;transition:opacity .8s;pointer-events:none;z-index:5;padding-inline:16px}
#skipEnd{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:6;font:600 13px var(--body);background:rgba(0,0,0,.5);color:var(--bone);border:1px solid #555;border-radius:4px;padding:8px 14px;cursor:pointer}
#toast{position:absolute;top:56px;right:max(16px,env(safe-area-inset-right,0px));z-index:9;background:rgba(10,10,10,.92);border:1px solid var(--white);border-radius:4px;padding:10px 14px;color:var(--white);font-size:13px;max-width:70%}
#ch1{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:20;background:#050505}
#cv.flash{filter:grayscale(1) brightness(5)}
.achl{display:grid;gap:8px;text-align:left;max-height:56vh;overflow:auto}
.ach{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;background:rgba(20,20,20,.8);border:1px solid #2a2a2a;border-radius:4px;padding:9px 11px}
.ach.done{border-color:#777}.ach .ic{width:30px;height:30px;border-radius:50%;border:1px solid #555;display:grid;place-items:center;font-weight:800;color:var(--dim)}.ach.done .ic{background:var(--white);color:var(--black);border-color:var(--white)}
.ach b{color:var(--white);font-size:14px}.ach span{display:block;font-size:12px;color:var(--dim);line-height:1.5}
#near{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-family:var(--serif);font-weight:800;font-size:13px;letter-spacing:.5em;color:var(--white);opacity:0;pointer-events:none;text-shadow:0 0 10px #000}
#touch{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border:1px solid #555;border-radius:50%;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(220,220,220,.3)}
.ctl{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.ctl button{font:600 13px var(--body);color:var(--white);background:rgba(20,20,20,.7);border:1px solid #444;border-radius:50%;width:66px;height:66px;cursor:pointer;touch-action:none}
.ctl button.cd{opacity:.35}
.ctl{flex-wrap:wrap-reverse;justify-content:flex-end;max-width:min(64vw,330px)}
#bChat,#bDev{display:none!important}
#bMore{background:rgba(242,240,234,.85)!important;color:var(--black)!important}
@media (max-width:520px){.ctl button{width:56px;height:56px;font-size:12px}}
#mobSheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:rgba(8,8,8,.95);border-top:1px solid #444;padding:14px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;pointer-events:auto;max-height:70vh;overflow:auto}
#mobSheet .sh{display:flex;align-items:center;justify-content:space-between}#mobSheet .sh b{font-family:var(--serif);font-size:18px;color:var(--white)}
#mobSheet .lab{font-size:11px;letter-spacing:.2em;color:var(--dim)}
#mobSheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
#mobSheet button{font:600 14px var(--body);background:#161616;color:var(--bone);border:1px solid #444;border-radius:6px;padding:12px 6px;cursor:pointer;touch-action:manipulation}
#mobSheet button.on{background:var(--white);color:var(--black);border-color:var(--white)}
#mobSheet .x{padding:8px 14px}
.ctl button.on{background:var(--bone);color:var(--black)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.78);z-index:5;box-sizing:border-box;overflow:auto;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov.title{background:radial-gradient(ellipse at center,rgba(0,0,0,.2),rgba(0,0,0,.7) 70%)}
@media (min-width:760px){.ov.title{align-items:flex-start;padding-left:max(5vw,16px);background:linear-gradient(to right,rgba(0,0,0,.88) 0,rgba(0,0,0,.6) 40%,rgba(0,0,0,0) 62%)}}
.card{width:min(390px,100%);display:grid;gap:14px;text-align:center;margin:auto 0}
.ov.title .card{background:rgba(5,5,5,.55);border:1px solid #222;padding:22px 20px;border-radius:4px;box-shadow:0 0 60px #000}
.kicker{font-size:11px;letter-spacing:.4em;color:var(--dim)}
.card h1{font-family:var(--serif);font-weight:800;font-size:clamp(40px,11vw,58px);margin:0;color:var(--white);letter-spacing:.06em;line-height:1.1;text-wrap:balance}
.card h1 .req{display:block;font-family:var(--serif);font-weight:700;font-size:.4em;letter-spacing:.95em;padding-left:.95em;color:var(--red);margin-top:12px;text-shadow:0 0 18px rgba(194,20,27,.55),0 0 2px rgba(194,20,27,.9)}
.shopTop{display:flex;align-items:center;gap:8px}
.shopTop .coin{margin-left:auto;color:var(--dim);font-size:13px}.shopTop .coin b{color:var(--white);font-size:18px;font-variant-numeric:tabular-nums}
.card .shopTop button{padding:8px 14px}
.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:56vh;overflow:auto}
.job{display:grid;gap:5px;align-content:start;background:rgba(20,20,20,.85);border:1px solid #2a2a2a;border-radius:4px;padding:10px;text-align:center;min-width:0}
.job.eq{border-color:var(--white)}
.job canvas.dprev{width:100%;aspect-ratio:1;display:block;filter:grayscale(1);border-radius:3px;background:#0a0a0a}
@media (max-width:460px){.job canvas.dprev{grid-row:span 6}}
.job img,.cx img,.cx .q{width:100%;aspect-ratio:1;max-width:100%;display:block;filter:grayscale(1);background:#0a0a0a;border-radius:3px}
.job b{font-family:var(--serif);font-size:16px;color:var(--white)}
.job .look{font-size:11px;color:var(--dim)}
.job p{font-size:12px!important;line-height:1.5!important}.job .eff{color:var(--bone)!important;text-align:left}
.card .job button{padding:9px 4px;font-size:12px;white-space:nowrap}
.codex{display:grid;gap:10px;text-align:left;max-height:56vh;overflow:auto}
.cx{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start;background:rgba(20,20,20,.8);border:1px solid #2a2a2a;padding:10px;border-radius:4px}
.cx .q{display:grid;place-items:center;font:800 40px var(--serif);color:#333}
.cxt{display:grid;gap:4px;min-width:0}
.cxt b{font-family:var(--serif);font-size:18px;color:var(--white)}
.cxt .kind{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.cxt dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;line-height:1.55}
.cxt dt{color:var(--dim)}.cxt dd{margin:0;color:var(--bone)}
.cxt .hint{font-size:12.5px;color:var(--bone);font-style:italic}
.cx.locked{opacity:.6}
.card input,.card select{font:500 15px var(--body);background:#111;color:var(--white);border:1px solid #444;border-radius:4px;padding:10px;min-width:0;width:100%;box-sizing:border-box}
.mpform{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;font-size:13px;color:var(--dim)}
.mpform label{display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.rooms{display:grid;gap:6px;max-height:30vh;overflow:auto}
.room{display:flex;align-items:center;gap:10px;background:rgba(20,20,20,.85);border:1px solid #2a2a2a;border-radius:4px;padding:8px 10px;text-align:left}
.room>div{flex:1;display:grid;gap:2px;min-width:0}.room b{color:var(--white)}.room span{font-size:12px;color:var(--dim)}.card .room button{flex:0 0 auto;padding:8px 14px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px;text-align:left;font-size:14px;color:var(--bone)}
.plist li{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .mini{font:600 12px var(--body);background:transparent;color:var(--bone);border:1px solid #444;border-radius:4px;padding:3px 8px;cursor:pointer}
.chatbox{display:grid;gap:6px}
.chatlog{max-height:22vh;overflow:auto;text-align:left;font-size:13px;line-height:1.5;color:var(--bone);background:rgba(10,10,10,.85);border:1px solid #2a2a2a;border-radius:4px;padding:6px 8px;min-height:60px}
.chatlog b,#chatfeed b{color:var(--white)}.chatlog .sys,#chatfeed .sys{color:var(--dim);font-style:italic}
#chatwrap{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:100px;width:min(360px,72%);z-index:6;display:grid;gap:6px}
#chatwrap input{font:500 14px var(--body);background:rgba(10,10,10,.9);color:var(--white);border:1px solid #555;border-radius:4px;padding:9px}
#chatfeed{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:84px;width:min(360px,72%);z-index:4;display:grid;gap:3px;font-size:13px;line-height:1.45;color:var(--bone);pointer-events:none}
#chatfeed>div{background:rgba(0,0,0,.6);padding:3px 8px;border-radius:3px;width:fit-content;max-width:100%}
.row.wrap{flex-wrap:wrap}.card .row.wrap>button{flex:0 0 auto;padding:8px 11px;font-size:13px}
.card .diffs button.god{grid-column:1/-1}.card .diffs button.locked{border-style:dashed}.card .diffs button .cond{font-size:11px;font-style:italic}
@media (max-width:460px){.mpform{grid-template-columns:1fr 1fr}.mpform label:first-child{grid-column:1/-1}}
.att{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.att div{display:grid;gap:2px;border:1px solid #333;border-radius:4px;padding:8px 2px;font-size:11px;color:var(--dim);background:rgba(20,20,20,.8)}
.att b{color:var(--white);font-size:12px}.att i{font-style:normal;font-size:10px}
.att .done{opacity:.45}.att .now{border-color:var(--white);background:rgba(255,255,255,.1);color:var(--bone)}
@media (max-width:460px){.att{grid-template-columns:repeat(4,1fr)}}
.wheelbox{position:relative;width:min(300px,100%);margin:0 auto;aspect-ratio:1}
.wheelbox canvas{width:100%;height:100%;display:block}
.wptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--white);z-index:1;filter:drop-shadow(0 2px 2px #000)}
.wres{min-height:1.6em;color:var(--white)!important;font-weight:600}
.confirm{display:grid;gap:10px;background:#0b0b0b;border:1px solid #333;border-radius:4px;padding:14px}
@media (max-width:460px){.jobs{grid-template-columns:1fr}.job{grid-template-columns:84px 1fr;text-align:left;align-items:center;column-gap:10px}.job img{grid-row:span 6}.cx{grid-template-columns:64px 1fr}}
.card h2{font-family:var(--serif);font-weight:800;font-size:34px;margin:0;color:var(--white)}
.card p{margin:0;font-size:14px;line-height:1.7;color:var(--dim);text-wrap:pretty}
.card p b{color:var(--white)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;font-size:13px;color:var(--bone);margin-inline:auto}
.keys b{color:var(--white);font-weight:600}
.card button{font:600 15px var(--body);background:var(--white);color:var(--black);border:0;border-radius:4px;padding:13px 20px;cursor:pointer}
.card button.ghost{background:transparent;color:var(--bone);border:1px solid #555}
.card button:focus-visible,.ctl button:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.diffs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card .diffs button{background:var(--ash);color:var(--bone);border:1px solid #444;text-align:left;padding:10px 12px;display:grid;gap:3px}
.card .diffs button b{font-family:var(--serif);font-size:18px;color:var(--white)}
.card .diffs button span{font-size:11.5px;font-weight:400;color:var(--dim);line-height:1.4}
.card .diffs button.sel{background:var(--white);border-color:var(--white)}
.card .diffs button.sel b,.card .diffs button.sel span{color:var(--black)}
.row{display:flex;gap:8px}.row>button{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.card .pad button{background:var(--ash);color:var(--white);border:1px solid #444;padding:14px 0;font-size:20px;font-variant-numeric:tabular-nums}
.disp{font-size:34px;letter-spacing:.4em;color:var(--white);font-variant-numeric:tabular-nums;padding-left:.4em;min-height:44px}
.small{font-size:12px!important;color:var(--dim)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flick{text-shadow:0 0 18px rgba(255,255,255,.25),3px 0 0 rgba(255,255,255,.08),-3px 0 0 rgba(0,0,0,.9);animation:fl 5s infinite steps(1)}
@keyframes fl{0%,100%{opacity:1}31%{opacity:.25}32%{opacity:1}33%{opacity:.5}34%{opacity:1}77%{opacity:1;transform:translateX(0)}78%{opacity:.3;transform:translateX(3px)}79%{opacity:1;transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.flick,.shake{animation:none}}
@media (max-width:520px){#hud{gap:10px;font-size:12px}.bar{width:44px}}

<script>window.Peer||document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<script>
/* GitHub build only: the same room API the game uses on claude.ai (lobby presence, named rooms), carried over PeerJS.
   Each room has one hub peer with a fixed id; whoever claims it first relays everyone's presence. If the hub leaves, the others race to take over. */
(function(){if(window.claude&&window.claude.use)return;
var PFX='ashhouse3d-v1-',ICE={config:{iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun.cloudflare.com:3478']},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}]}};
var OPT=Object.assign({},ICE,window.__PEEROPT||{});
var hid=function(n){return PFX+String(n).replace(/[^a-zA-Z0-9_-]/g,function(c){return '_'+c.charCodeAt(0).toString(16)})};
var meP=null;
function getMe(){if(meP)return meP;meP=new Promise(function(res,rej){var p;try{p=new Peer(OPT)}catch(e){meP=null;rej(e);return}var ok=false;
  p.on('open',function(){ok=true;res(p)});p.on('error',function(e){if(!ok){meP=null;rej(e)}});p.on('disconnected',function(){try{if(!p.destroyed)p.reconnect()}catch(e){}})});return meP}
function mkRoom(name){return getMe().then(function(me){
  var myId=me.id,mine={},st={},seen={},lst=[],last=[],gone=false,hub=null,hubConns={},conn=null,timer=null,lastAll=0,rooms={},q=false;
  function emit(){var peers=[{peer:myId,presence:mine,sameTab:true,isMe:true,kind:'user'}];Object.keys(st).forEach(function(k){if(k!==myId)peers.push({peer:k,presence:st[k],sameTab:false,isMe:false,kind:'user'})});
    var prev={},now={};last.forEach(function(p){prev[p.peer]=1});peers.forEach(function(p){now[p.peer]=1});
    var ev={peers:peers,joined:peers.filter(function(p){return!prev[p.peer]}),left:last.filter(function(p){return!now[p.peer]}),updated:peers};last=peers;
    lst.slice().forEach(function(f){try{f(ev)}catch(e){console.error(e)}})}
  function soon(){if(q)return;q=true;setTimeout(function(){q=false;if(!gone)emit()},0)}
  function hubSend(){var all={};for(var k in st)all[k]=st[k];all[myId]=mine;for(var c in hubConns){try{hubConns[c].send({t:'all',st:all})}catch(e){}}}
  function claim(){if(gone)return;var p;try{p=new Peer(hid(name),OPT)}catch(e){join();return}var done=false;
    p.on('open',function(){done=true;if(gone){p.destroy();return}hub=p;st={};hubConns={};seen={};
      p.on('connection',function(c){var key=c.connectionId||(c.peer+Math.random());c.on('data',function(d){if(!d||d.t!=='p')return;hubConns[key]=c;c._pid=d.id;st[d.id]=d.pr||{};seen[d.id]=Date.now();hubSend();soon()});
        var bye=function(){if(hubConns[key]!==c)return;delete hubConns[key];var still=false;for(var k in hubConns)if(hubConns[k]._pid===c._pid)still=true;if(c._pid&&!still){delete st[c._pid];delete seen[c._pid]}hubSend();soon()};c.on('close',bye);c.on('error',bye)});
      p.on('disconnected',function(){try{if(!p.destroyed)p.reconnect()}catch(e){}});soon()});
    p.on('error',function(e){if(done)return;done=true;try{p.destroy()}catch(_){}if(e&&e.type==='unavailable-id')join();else retry()})}
  function join(){if(gone)return;var c;try{c=me.connect(hid(name),{reliable:true,serialization:'json'})}catch(e){retry();return}conn=c;var opened=false;
    var to=setTimeout(function(){if(!opened&&conn===c){conn=null;try{c.close()}catch(e){}retry()}},9000);
    c.on('open',function(){opened=true;clearTimeout(to);lastAll=Date.now();c.send({t:'p',id:myId,pr:mine})});
    c.on('data',function(d){if(d&&d.t==='all'){lastAll=Date.now();st={};for(var k in d.st)if(k!==myId)st[k]=d.st[k];soon()}});
    var lost=function(){if(conn!==c)return;conn=null;st={};soon();retry()};c.on('close',lost);c.on('error',lost)}
  function retry(){if(gone)return;clearTimeout(timer);timer=setTimeout(claim,400+Math.random()*1800)}
  var beat=setInterval(function(){if(gone){clearInterval(beat);return}var t=Date.now();
    if(hub){var ch=false;for(var k in seen)if(t-seen[k]>20000){delete seen[k];delete st[k];ch=true}hubSend();if(ch)soon()}
    else if(conn&&conn.open){try{conn.send({t:'p',id:myId,pr:mine})}catch(e){}if(t-lastAll>20000){var c=conn;conn=null;try{c.close()}catch(e){}st={};soon();retry()}}},3000);
  claim();
  var api={name:name,
    presence:function(p){try{p=JSON.parse(JSON.stringify(p||{}))}catch(e){p={}}var n={};for(var k in mine)n[k]=mine[k];for(var k2 in p){if(p[k2]===null||p[k2]===undefined)delete n[k2];else n[k2]=p[k2]}mine=n;
      if(hub)hubSend();else if(conn&&conn.open){try{conn.send({t:'p',id:myId,pr:mine})}catch(e){}}soon();return Promise.resolve()},
    onPeers:function(f){lst.push(f);soon();return function(){var i=lst.indexOf(f);if(i>=0)lst.splice(i,1)}},
    peers:function(){return last},
    join:function(n){if(rooms[n]&&!rooms[n]._gone)return Promise.resolve(rooms[n]);return mkRoom(n).then(function(r){rooms[n]=r;return r})},
    leave:function(){gone=true;api._gone=true;clearTimeout(timer);clearInterval(beat);if(conn){try{conn.close()}catch(e){}}if(hub){try{hub.destroy()}catch(e){}}return Promise.resolve()}};
  return api})}
var lobby=null;
window.claude={use:function(n){if(n!=='room')return Promise.resolve(null);if(!window.Peer)return Promise.resolve(null);return lobby||(lobby=mkRoom('lobby').catch(function(e){lobby=null;return null}))}};
})();
</script>

/* ── path finding (the creature can break through boarded doors, never into the first room) ── */
function bfs(sr,sc,tr,tc){const pass=(r,c)=>r>=0&&c>=0&&r<ROWS&&c<COLS&&!(SOLID.replace('P','')+',').includes(g[r][c]);
  if(!pass(tr,tc))return[];const prev=new Map(),q=[[sr,sc]],k=(r,c)=>r*COLS+c;prev.set(k(sr,sc),null);let h=0;
  while(h<q.length){const [r,c]=q[h++];if(r===tr&&c===tc)break;for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;if(pass(nr,nc)&&!prev.has(k(nr,nc))){prev.set(k(nr,nc),[r,c]);q.push([nr,nc])}}}
  if(!prev.has(k(tr,tc)))return[];const path=[];let cur=[tr,tc];while(cur){path.unshift(cur);cur=prev.get(k(cur[0],cur[1]))}return path.slice(1)}
function randomFloor(){for(;;){const r=1+Math.floor(Math.random()*(ROWS-2)),c=1+Math.floor(Math.random()*(COLS-2));if(g[r][c]==='.')return[r,c]}}
function farFloor(){for(let i=0;i<200;i++){const [r,c]=randomFloor();if(Math.hypot(c+.5-P.x,r+.5-P.y)>12)return[r,c]}return randomFloor()}
function patrolTarget(m){m=m||M;if(P.hidden||m.avoid>0){for(let i=0;i<200;i++){const [r,c]=randomFloor();if(Math.hypot(c+.5-P.x,r+.5-P.y)>10)return[r,c]}}if(m.arrive<=0&&Math.random()<.7){for(let i=0;i<60;i++){const r=Math.floor(P.y)+Math.floor(rnd(-5,6)),c=Math.floor(P.x)+Math.floor(rnd(-5,6));if(r>0&&c>0&&r<ROWS-1&&c<COLS-1&&g[r][c]==='.')return[r,c]}}return randomFloor()}
function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/.1);for(let i=1;i<n;i++){const x=ax+(bx-ax)*i/n,y=ay+(by-ay)*i/n;if(solidAt(x,y))return false}return true}

/* every dance card plays its dance live */
let prevRun=0;
function startPreviews(){const cs=[...document.querySelectorAll('canvas[data-prev]')];if(!cs.length)return;const run=++prevRun;
  try{if(!prR){const c=document.createElement('canvas');c.width=c.height=200;prR=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});prR.setSize(200,200,false)}}catch(e){return}
  const sc=new THREE.Scene();sc.background=new THREE.Color(0x0b0b0b);sc.add(new THREE.AmbientLight(0xffffff,.35));const dl=new THREE.DirectionalLight(0xffffff,.95);dl.position.set(1.5,2.5,3);sc.add(dl);
  const cam=new THREE.PerspectiveCamera(35,1,.05,40);cam.position.set(0,1.2,3.9);cam.lookAt(0,.95,0);const f=makePlayerFig(JOB());f.rotation.y=-.3;sc.add(f);let last=0;
  const tick=now=>{if(run!==prevRun||!cs[0].isConnected)return;if(now-last>40){last=now;const t=now/1000;cs.forEach((c,i)=>{danceAnim(f,c.dataset.prev,t+i*.37);prR.render(sc,cam);const x=c.getContext('2d');x.drawImage(prR.domElement,0,0,c.width,c.height)})}requestAnimationFrame(tick)};requestAnimationFrame(tick)}
/* roulette: 2 coins a spin, the wheel slows and stops on a weighted slice */
const WHEEL=[{t:'coin',n:2,p:35,l:'2코인'},{t:'dance',id:'hakari',p:10,l:'하카리 댄스'},{t:'coin',n:3,p:20,l:'3코인'},{t:'job',id:'over',p:3,l:'사기 직업'},{t:'coin',n:4,p:15,l:'4코인'},{t:'none',p:10,l:'꽝'},{t:'dance',id:'ironman',p:7,l:'아이언맨 날기'}];
let wheelRot=0,wheelBusy=false;
function drawWheel(c){const x=c.getContext('2d'),W=c.width,R=W/2-6,tot=WHEEL.reduce((a,b)=>a+b.p,0);let a=-Math.PI/2;x.clearRect(0,0,W,W);
  WHEEL.forEach((w,i)=>{const sw=w.p/tot*Math.PI*2;x.beginPath();x.moveTo(W/2,W/2);x.arc(W/2,W/2,R,a,a+sw);x.closePath();x.fillStyle=w.t==='job'?'#c2141b':w.t==='dance'?'#d9d6cf':w.t==='none'?'#151515':['#2c2b29','#3a3936','#4a4845'][i%3];x.fill();x.strokeStyle='#050505';x.lineWidth=2;x.stroke();
    x.save();x.translate(W/2,W/2);x.rotate(a+sw/2);x.fillStyle=w.t==='dance'?'#050505':'#f2f0ea';x.font=`700 ${sw<.4?12:15}px "IBM Plex Sans KR",sans-serif`;x.textAlign='right';x.textBaseline='middle';x.fillText(w.l,R-10,0);x.font='600 11px "IBM Plex Sans KR",sans-serif';x.globalAlpha=.7;x.fillText(w.p+'%',R-10,14);x.restore();a+=sw});
  x.beginPath();x.arc(W/2,W/2,R,0,7);x.strokeStyle='#f2f0ea';x.lineWidth=4;x.stroke();x.beginPath();x.arc(W/2,W/2,22,0,7);x.fillStyle='#050505';x.fill();x.strokeStyle='#f2f0ea';x.lineWidth=3;x.stroke()}
function showWheel(){shopTab='wheel';$('card').innerHTML=`<div class="shopTop"><button class="ghost" id="back">나가기</button><span class="coin">코인 <b>${coins}</b></span></div><h2>상점</h2>
  <div class="row"><button class="ghost" id="tJob">직업</button><button class="ghost" id="tDance">춤</button><button id="tWheel">룰렛</button></div>
  <p>2코인을 내고 돌린다. 하카리 댄스, 아이언맨 날기, 사기 직업 초월자는 룰렛에서만 나온다. 이미 가진 춤이나 직업이 나오면 대신 5코인.</p>
  <div class="wheelbox"><div class="wptr"></div><canvas id="wheel" width="300" height="300" style="transform:rotate(${wheelRot}deg)"></canvas></div><p id="wres" class="wres">&nbsp;</p><button id="spin" ${wheelBusy?'disabled':''}>2코인으로 돌리기</button>`;
  drawWheel($('wheel'));$('back').onclick=menu;$('tJob').onclick=()=>showShop('job');$('tDance').onclick=()=>showShop('dance');$('tWheel').onclick=showWheel;$('spin').onclick=spinWheel}
function spinWheel(){if(wheelBusy)return;if(coins<2){$('wres').textContent=`코인이 부족하다. 지금 ${coins}코인이 있다.`;return}audio();coins-=2;saveMeta();wheelBusy=true;$('spin').disabled=true;$('wres').innerHTML='&nbsp;';$('card').querySelector('.coin b').textContent=coins;
  const tot=WHEEL.reduce((a,b)=>a+b.p,0);let r=Math.random()*tot,idx=0;for(;idx<WHEEL.length;idx++){r-=WHEEL[idx].p;if(r<0)break}idx=Math.min(idx,WHEEL.length-1);
  let start=0;for(let i=0;i<idx;i++)start+=WHEEL[i].p/tot*360;const sw=WHEEL[idx].p/tot*360,land=start+sw*(.18+Math.random()*.64);
  const cur=((wheelRot%360)+360)%360,target=wheelRot+360*6+((360-land-cur)%360+360)%360;wheelRot=target;const c=$('wheel');c.style.transition='transform 5.2s cubic-bezier(.1,.72,.1,1)';requestAnimationFrame(()=>{c.style.transform=`rotate(${target}deg)`});
  let tk=0;const tick=()=>{if(!wheelBusy)return;tk++;tone(1400,.03,.05,'square');setTimeout(tick,40+tk*tk*.9)};tick();
  setTimeout(()=>{wheelBusy=false;const w=WHEEL[idx];let txt=w.l;
    if(w.t==='coin')coins+=w.n;else if(w.t==='dance'){if(owned['d_'+w.id]){coins+=5;txt+=' (이미 있어서 5코인)'}else owned['d_'+w.id]=true}else if(w.t==='job'){if(owned[w.id]){coins+=5;txt+=' (이미 있어서 5코인)'}else{owned[w.id]=true;txt='사기 직업 · 초월자! 상점 직업 탭에서 장착'}}
    saveMeta();if(w.t!=='none'){tone(880,.2,.12,'triangle');setTimeout(()=>tone(1320,.35,.12,'triangle'),150)}else thump(.6);
    if($('wres')){$('wres').textContent=w.t==='none'?'꽝… 다음에는 나올지도 모른다':'당첨 · '+txt;$('spin').disabled=false;$('card').querySelector('.coin b').textContent=coins}},5400)}
