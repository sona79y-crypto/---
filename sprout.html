async function hashPw(id,pw,salt){
  const txt=salt+'|'+id+'|'+pw;
  try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=2166136261;for(let r=0;r<2000;r++)for(let i=0;i<txt.length;i++){h^=txt.charCodeAt(i)+r;h=Math.imul(h,16777619)>>>0}return 'f'+h.toString(16)}
}
function newSalt(){const a=new Uint8Array(12);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<12;i++)a[i]=Math.random()*256}return [...a].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function pushRank(){
  if(!NET.db||!S)return;try{await NET.db.doc(`rank/${NET.uid}`).set({nick:S.nick,lv:S.lv,job:S.job,cp:Math.floor(combatPower()),t:Date.now()})}catch(e){}
}
async function fetchRank(){
  if(!NET.db)return null;try{const q=await NET.db.collection('rank').orderBy('cp','desc').limit(30).get();return q.docs.map(d=>({id:d.id,...d.data()}))}catch(e){return null}
}

function bindPointer(cv){
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointerdown',e=>{AU.init();try{window.focus()}catch(_){}if(G.device==='mobile'){if(IN.look.id===null){IN.look.id=e.pointerId;IN.look.x=e.clientX;IN.look.y=e.clientY}return}
    if(e.button===2||e.button===1){IN.rdown=true;IN.lastX=e.clientX;IN.lastY=e.clientY}else if(e.button===0){IN.mdown=true;IN.lastX=e.clientX;IN.lastY=e.clientY;IN.dragged=0;act('atk')}});
  addEventListener('pointermove',e=>{if(G.device==='mobile'){if(e.pointerId===IN.look.id){CAM.yaw-=(e.clientX-IN.look.x)*.008*G.sens;CAM.pitch=clamp(CAM.pitch+(e.clientY-IN.look.y)*.006*G.sens,-1.25,1.45);IN.look.x=e.clientX;IN.look.y=e.clientY}return}
    if(IN.rdown||IN.mdown||document.pointerLockElement){const dx=document.pointerLockElement?e.movementX:e.clientX-IN.lastX,dy=document.pointerLockElement?e.movementY:e.clientY-IN.lastY;CAM.yaw-=dx*.006*G.sens;CAM.pitch=clamp(CAM.pitch+dy*.005*G.sens,-1.25,1.45);IN.lastX=e.clientX;IN.lastY=e.clientY}});
  addEventListener('pointerup',e=>{if(e.pointerId===IN.look.id)IN.look.id=null;if(e.button===2||e.button===1)IN.rdown=false;if(e.button===0)IN.mdown=false});
  cv.addEventListener('wheel',e=>{CAM.dist=clamp(CAM.dist+e.deltaY*.01,4,16);e.preventDefault()},{passive:false});
  // touch joystick + buttons
  const joy=$('#joy'),knob=$('#joy i');
  joy.addEventListener('pointerdown',e=>{AU.init();IN.joy.id=e.pointerId;const r=joy.getBoundingClientRect();IN.joy.cx=r.left+r.width/2;IN.joy.cy=r.top+r.height/2;joy.setPointerCapture(e.pointerId);moveJoy(e)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===IN.joy.id)moveJoy(e)});
  const endJoy=e=>{if(e.pointerId===IN.joy.id){IN.joy.id=null;IN.joy.x=IN.joy.y=0;knob.style.transform=''}};
  joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
  function moveJoy(e){let dx=e.clientX-IN.joy.cx,dy=e.clientY-IN.joy.cy;const m=Math.hypot(dx,dy),R=50;if(m>R){dx*=R/m;dy*=R/m}IN.joy.x=dx/R;IN.joy.y=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`}
  const tb={tAtk:'atk',tRoll:'roll',tJump:'jump',tS1:'s1',tS2:'s2',tS3:'s3',tS4:'s4',tLock:'lock',tMount:'mount',tRun:'run',tS5:'s5',tS6:'s6',tS7:'s7',tS8:'s8',tUlt:'ult',tPot:'pot',tUse:'use'};
  for(const id in tb){const el=$('#'+id);el.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();act(tb[id]);if(id==='tAtk')IN.tAtk=true;el.classList.add('on')});
    const up=()=>{if(id==='tAtk')IN.tAtk=false;el.classList.remove('on')};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)}
}

      const nm=r.g.skin?SKINS[r.g.skin].n:r.n,ic=r.g.skin?'👗':r.ic;const el=h(`<div class="gc" style="border-color:${RAR[r.r].c};animation-delay:${i*.08}s"><div class="ic">${ic}</div><b class="rar-${r.r}">${RAR[r.r].n}</b><div>${nm}</div>${dup?'<small style="color:var(--muted)">중복 → 💎</small>':''}</div>`).firstChild;cards.appendChild(el)});
      ok.classList.remove('hide');markDirty(true)},600)},n===10?1500:1000);

function buildHidden4(){const g=new T.Group();const f=new T.Mesh(boxGeo(HID2.r*2,.1,HID2.r*2,3),mat(0x4a3420,{map:tex('noise')}));f.position.set(HID2.x,-.05,HID2.z);g.add(f);
  const wl=mat(0x2a2030,{map:tex('stone')});[[HID2.x-HID2.r,HID2.z,1.2,HID2.r*2],[HID2.x+HID2.r,HID2.z,1.2,HID2.r*2],[HID2.x,HID2.z-HID2.r,HID2.r*2,1.2],[HID2.x,HID2.z+HID2.r,HID2.r*2,1.2]].forEach(([x,z,w,d])=>{const m=new T.Mesh(boxGeo(w,8,d,2),wl);m.position.set(x,4,z);g.add(m);addCol(x-w/2,z-d/2,x+w/2,z+d/2,99)});
  R.world.add(g);for(let i=0;i<26;i++){const a=i/26*Math.PI*2,r=HID2.r-2.2+rnd(-.6,.6);const ph=pumpkinHead(.8+Math.random()*.7,Math.random()<.6);ph.position.set(HID2.x+Math.cos(a)*r,.2,HID2.z+Math.sin(a)*r);ph.rotation.y=-a+Math.PI/2;R.world.add(ph)}
  for(let k=0;k<4;k++){const a=k/4*Math.PI*2+.4;const pl=new T.PointLight(0xff8a2a,.9,26,1.6);pl.position.set(HID2.x+Math.cos(a)*10,3,HID2.z+Math.sin(a)*10);R.world.add(pl)}
  const moon=mesh(GEO.sph,new T.MeshBasicMaterial({color:0xfff0c0}),HID2.x+8,14,HID2.z-HID2.r+.8,2.4,2.4,.2);R.world.add(moon);
  const sign=labelSprite('B4 호박 창고','#ffd98a',2);sign.position.set(HID2.x,7,HID2.z-HID2.r+1.2);R.world.add(sign);
  const cage=new T.Group();cage.position.set(HID2.x-HID2.r+4,0,HID2.z-HID2.r+4);for(let i=0;i<10;i++){const a=i/10*Math.PI*2;cage.add(bx(0x8a8a90,Math.cos(a)*1.3,1,Math.sin(a)*1.3,.08,2,.08))}cage.add(mesh(GEO.cyl,mat(0x8a8a90),0,2,0,2.7,.1,2.7));const pd=makeMonster('angipet');cage.add(pd);R.world.add(cage);A4.cage=cage;A4.cageDog=pd;
  const portal=mesh(new T.TorusGeometry(1.6,.25,8,24),new T.MeshBasicMaterial({color:0xff8a2a}),HID2.x,2,HID2.z+HID2.r-3);portal.visible=false;R.world.add(portal);W.hid4Portal=portal;
  interact(HID2.x,HID2.z+HID2.r-3,'호박 창고에서 나가기',()=>{portal.visible=false;const rm=DUN.apt4.rooms[2];P.x=rm.x1-2;P.z=rm.cz;P.y=0;G.inHidden=false;G.hidName=null},3,()=>G.dun&&G.dun.key==='apt4'&&portal.visible);
  const rm=DUN.apt4.rooms[2];const door=new T.Group();door.position.set(rm.x1-.02,0,rm.cz);door.add(bx(0x3a2a1a,0,1.3,0,.12,2.6,1.6));const pk=pumpkinHead(.5,true);pk.position.set(-.3,2.9,0);pk.rotation.y=-Math.PI/2;door.add(pk);const dl=labelSprite('B4 창고','#ffd98a',.9);dl.position.set(-.3,3.6,0);door.add(dl);R.world.add(door);
  interact(rm.x1-.8,rm.cz,'수상한 호박 문을 연다',()=>enterHidden4(),2.4,()=>G.dun&&G.dun.key==='apt4'&&!G.inHidden)}
function enterHidden4(){if(!S.dun.apt4){showDlg('B4 호박 창고','문 너머에서 "히히히…" 웃음소리와 강아지 낑낑대는 소리가 들린다.\n문이 잠겨 있다. 지하주차장의 주인, 거대 강아지 앙이를 먼저 진정시켜야 할 것 같다.');return}
  showDlg('B4 호박 창고','문틈으로 주황빛이 새어 나온다… 🎃\n앙이를 저렇게 크게 만든 범인이 안에 있는 것 같다. (권장 Lv.30+)',[{t:'🚪 들어간다',fn:()=>{P.x=HID2.x;P.z=HID2.z+HID2.r-4;P.y=0;P.rot=Math.PI;G.inHidden=true;G.hidName='B4 호박 창고';W.hid4Portal.visible=false;G.mons.filter(m=>m.hidden).forEach(removeMon);if(A4.cage)A4.cage.visible=true;
    const b=spawnMon('sanghu',HID2.x,HID2.z-5,{dun:'apt4'});b.hidden=true;b.aggro=false;sanghuCut(b)}}])}
function sanghuCut(b){const X=HID2.x,Z=HID2.z;const cg=A4.cage.position;
  playCut({dur:13,shots:[{d:3.6,from:[X+14,12,Z+14],to:[X-6,7,Z+12],look:[X,1,Z]},{d:3.2,from:[cg.x+5,2.4,cg.z+5],to:[cg.x+3.5,1.8,cg.z+3.5],look:[cg.x,.6,cg.z]},{d:3.4,from:[b.x+1.5,3.5,b.z+6],to:[b.x,3.4,b.z+4.2],look:[b.x,3,b.z]},{d:3,from:[b.x-5,1.5,b.z+8],to:[b.x-7,2.5,b.z+12],look:[b.x,2.5,b.z],look2:[P.x,1.5,P.z]}],
    lines:[[0,'','(호박 창고 안… 수백 개의 호박 등불이 일제히 켜진다)',()=>AU.tone(110,.8,.1,'triangle',.5)],[2,'🎃 ???','히히히… 내 귀여운 앙이를 진정시킨 게 너야?'],[3.6,'🐶 앙이','끼잉… 끼잉… (철창 안에서 꼬리를 말고 떨고 있다)',()=>AU.tone(1200,.15,.06,'sine')],[6.8,'🎃 호박 마왕 상후','앙이는 내 호박 마법으로 집채만 하게 커졌었지. 이제 네가 내 다음 실험체다!',()=>{shake(.4);AU.boom()}],[10.2,'🎃 호박 마왕 상후','호박 축제의 시작이다!! 히히히히!',()=>{shake(.6);AU.boom();burst(b.x,3,b.z,0xff8a2a,30,8)}]],
    onEnd:()=>{b.aggro=true;bossIntro(b)}})}
function hwiCut(b){const X=HID.x,Z=HID.z;
  playCut({dur:12,shots:[{d:3.4,from:[X-14,10,Z+14],to:[X+10,8,Z+12],look:[X,1,Z]},{d:3.6,from:[b.x,2.2,b.z+3],to:[b.x+.4,3.4,b.z+5.5],look:[b.x,2.6,b.z]},{d:2.6,from:[P.x+3,2,P.z+3],to:[P.x+2,2.4,P.z+4],look:[P.x,1.5,P.z]},{d:2.4,from:[b.x-4,1.2,b.z+6],to:[b.x-2,4.5,b.z+9],look:[b.x,3,b.z]}],
    lines:[[0,'','(방 안에 🎵 마따꼴라~ 음악이 쿵쿵 울려 퍼진다…)',()=>{for(let k=0;k<6;k++)setTimeout(()=>AU.tone([523,659,784,659,880,784][k],.22,.07,'square'),k*220)}],[2.6,'👑 ???','…누구야. 노크도 안 하고 남의 방에 들어온 게.'],[4.6,'👑 휘원 대마왕','블록 성 다 쌓아 놨는데… 잼민이가 열쇠를 흘리고 다녔구나.',()=>shake(.3)],[7.2,'🙂 나','(엄청난 기운이 느껴진다…!)'],[9.4,'👑 휘원 대마왕','좋아. 내 큰칼 맛을 보여 주지!!',()=>{shake(.7);AU.boom();burst(b.x,3,b.z,0xc377ff,30,8)}]],
    onEnd:()=>{b.aggro=true;bossIntro(b)}})}
function sanghuCleared(m){W.hid4Portal.visible=true;G.hidName='B4 호박 창고';const first=!S.flags.sanghu;S.flags.sanghu=(S.flags.sanghu||0)+1;toast('호박 마왕 상후를 쓰러뜨렸다!!','big');AU.win();
  grant(first?{gems:350,gold:24000,mats:{stone:35,prot:6}}:{gems:45,gold:7000,mats:{stone:9}},'호박 창고의 보물');
  if(!S.petOwn){S.petOwn=1;S.petEq=1;setTimeout(()=>{toast('🐶 마법이 풀린 앙이가 꼬리를 흔들며 따라온다! 「펫 앙이」 획득!','big');areaCard('펫 앙이 합류!','옷장(K)에서 데리고 다닐 수 있어요')},1600)}
  S.hatOwn=S.hatOwn||[];if(!S.hatOwn.includes('pumpkin')){S.hatOwn.push('pumpkin');setTimeout(()=>toast('🎃 「호박 모자」 획득! 옷장(K)에서 쓸 수 있어요','big'),3600)}
  if(A4.cage)A4.cage.visible=false;a4QEvent('hidden');markDirty(true)}
/* ---------- boss AI ---------- */
function apt4BossAI(m,dp,fast){const a=monFacePlayer(m);const b=m.d.boss;const ph2=m.phase===2;
  const circle=(x,z,r,dur,mul,col,kb=8,onEnd)=>tele({type:'circle',x,z,r,dur:dur*fast,dmg:m.atk*mul,owner:m,color:col,kb,onEnd});
  const line=(ang,len,w,dur,mul,col,onEnd,x=m.x,z=m.z)=>tele({type:'line',x,z,ang,len,w,dur:dur*fast,dmg:m.atk*mul,owner:m,color:col,kb:12,onEnd});
  const wave=(r,dur,mul,col)=>tele({type:'wave',x:m.x,z:m.z,r,dur,dmg:m.atk*mul,owner:m,color:col});
  const dashTo=(ang,len)=>{m.ang=ang;m.state='dash';m.wt=len/26};
  if(b==='angi'){const p=pickW({bark:2.5,zoom:3,bone:2.5,pounce:dp>6?2.5:1,dig:2,pups:ph2?1.2:0});
    if(p==='bark'){m.state='busy';m.wt=1.9;const n=ph2?3:2;for(let k=0;k<n;k++)setTimeout(()=>{if(m.dead)return;AU.tone(240,.18,.12,'sawtooth');wave(17,1.2,1,0xffe0a0);shake(.25)},k*520);toast('🐶 멍!! 멍!! (점프!)','big')}
    else if(p==='zoom'){m.state='busy';m.wt=99;let n=0;const go=()=>{if(m.dead)return;if(n++>=(ph2?5:3)){m.state='busy';m.wt=.7;return}const an=monFacePlayer(m);m.ang=an;line(an,22,3.2,.55,1.3,0xffd0a0,()=>{if(m.dead)return;dashTo(an,22);setTimeout(go,880)})};go();toast('🐕 우다다다! 앙이의 폭주!')}
    else if(p==='bone'){m.state='busy';m.wt=1.3;for(let k=-2;k<=2;k++)eShoot(m,m.x,m.y+1.5,m.z,a+k*.28,13,m.atk*.8,0xfff4d8,false);for(let k=0;k<(ph2?6:4);k++){const tx=P.x+rnd(-5,5),tz=P.z+rnd(-5,5);setTimeout(()=>{if(!m.dead)circle(tx,tz,2.2,.95,1.2,0xfff4d8,6,o=>{const bn=bx(0xfff4d8,o.x,.2,o.z,.9,.18,.18);R.world.add(bn);setTimeout(()=>R.world.remove(bn),2000)})},k*160)}toast('🦴 뼈다귀 던지기!')}
    else if(p==='pounce'){m.state='busy';m.wt=1.5;const tx=P.x,tz=P.z;circle(tx,tz,4.2,1.05,1.7,0xff8a5a,14,o=>{m.x=o.x;m.z=o.z;m.g.position.set(o.x,0,o.z);shake(.6);AU.boom();burst(o.x,.5,o.z,0xc8a070,20,6);if(ph2)wave(12,1,1,0xff8a5a)});toast('🐾 덮치기!')}
    else if(p==='dig'){m.state='busy';m.wt=1.6;for(let k=0;k<5;k++)setTimeout(()=>{if(m.dead)return;circle(P.x,P.z,2.4,.8,1.1,0xa07a4a,6,o=>burst(o.x,.3,o.z,0xa07a4a,12,5))},k*260);toast('🕳️ 땅 파기! 계속 움직여!')}
    else{m.state='busy';m.wt=1;for(let k=0;k<3;k++){const s=spawnMon('stray',m.x+rnd(-8,8),m.z+rnd(-8,8),{dun:'apt4'});s.aggro=true;s.summon=true}toast('🐶 친구들 불러오기! 아우~~')}}
  else if(b==='sanghu'){const p=pickW({bombs:3,roll:2.5,vines:2.5,fire:dp<10?3:1,scythe:dp<7?3:1,blink:2,ghosts:ph2?1:.4,night:ph2&&!m.nightDone?3:0});
    if(p==='bombs'){m.state='busy';m.wt=1.6;const n=ph2?12:8;for(let k=0;k<n;k++){const tx=P.x+rnd(-6,6),tz=P.z+rnd(-6,6);setTimeout(()=>{if(m.dead)return;circle(tx,tz,2.3,1,1.3,0xff8a2a,8,o=>{burst(o.x,.6,o.z,0xff8a2a,14,6,.6);AU.boom()});const pk=pumpkinHead(.6,true);pk.position.set(m.x,4,m.z);R.world.add(pk);let q=0;const iv=setInterval(()=>{q+=.08;pk.position.set(lerp(m.x,tx,q),4+Math.sin(q*Math.PI)*6-q*3.8,lerp(m.z,tz,q));pk.rotation.x+=.3;if(q>=1){clearInterval(iv);R.world.remove(pk)}},30)},k*120)}toast('🎃 호박 폭탄!')}
    else if(p==='roll'){m.state='busy';m.wt=1.8;const side=Math.random()<.5?-1:1;[-6,0,6].forEach((off,k)=>{const z=P.z+off;setTimeout(()=>{if(m.dead)return;line(side>0?Math.PI/2:-Math.PI/2,HID2.r*2-2,3,.9,1.4,0xff9a3a,o=>{const pk=pumpkinHead(1.2,true);const sx=side>0?HID2.x-HID2.r+1:HID2.x+HID2.r-1;pk.position.set(sx,.6,z);R.world.add(pk);let q=0;const iv=setInterval(()=>{q+=.05;pk.position.x=sx+side*q*(HID2.r*2-2);pk.rotation.z-=side*.35;if(q>=1){clearInterval(iv);R.world.remove(pk)}},30)},side>0?HID2.x-HID2.r+1:HID2.x+HID2.r-1,z)},k*350)});toast('🎃 굴러오는 호박! 피해!','big')}
    else if(p==='vines'){m.state='busy';m.wt=1.6;const an=a;for(let k=1;k<=7;k++)setTimeout(()=>{if(m.dead)return;circle(m.x+Math.sin(an)*k*2.6,m.z+Math.cos(an)*k*2.6,2,.55,1.2,0x5fd04a,10)},k*110);if(ph2)[-.6,.6].forEach(d=>{for(let k=1;k<=6;k++)setTimeout(()=>{if(!m.dead)circle(m.x+Math.sin(an+d)*k*2.6,m.z+Math.cos(an+d)*k*2.6,1.8,.55,1.1,0x5fd04a,10)},k*110+200)});toast('🌿 호박 덩굴!')}
    else if(p==='fire'){m.state='busy';m.wt=1.3;tele({type:'cone',x:m.x,z:m.z,r:12,ang:a,arc:1.1,dur:.9*fast,dmg:m.atk*1.5,owner:m,color:0xff5a1a,kb:10,onEnd:o=>{for(let i=0;i<30;i++)particle(m.x,m.y+2.6,m.z,0xff7a1a,{vx:Math.sin(o.ang+rnd(-.45,.45))*rnd(8,16),vy:rnd(0,2),vz:Math.cos(o.ang+rnd(-.45,.45))*rnd(8,16),g:1,s:.7,life:.7,grow:1.5});AU.boom()}});toast('🔥 잭오랜턴 불꽃!')}
    else if(p==='scythe'){m.state='busy';m.wt=1.8;tele({type:'circle',x:m.x,z:m.z,r:6.5,dur:.85*fast,dmg:m.atk*1.6,owner:m,follow:true,color:0xff8a2a,kb:14,onEnd:()=>{slashFx(m.x,2,m.z,m.ang,7,0xff8a2a,2);shake(.5);wave(16,1.3,1.1,0xff8a2a)}});toast('🪓 회전 낫!')}
    else if(p==='blink'){m.state='busy';m.wt=1.4;burst(m.x,2,m.z,0x3a1a0a,20,5);const ba=P.rot+Math.PI;const nx=clamp(P.x+Math.sin(ba)*4,HID2.x-HID2.r+2,HID2.x+HID2.r-2),nz=clamp(P.z+Math.cos(ba)*4,HID2.z-HID2.r+2,HID2.z+HID2.r-2);m.x=nx;m.z=nz;m.g.position.set(nx,0,nz);burst(nx,2,nz,0xff8a2a,20,5);tele({type:'cone',x:nx,z:nz,r:7,ang:monFacePlayer(m),arc:1.8,dur:.6*fast,dmg:m.atk*1.5,owner:m,color:0xff5a1a,kb:14});toast('👻 뒤에 있다!','big')}
    else if(p==='ghosts'){m.state='busy';m.wt=1;for(let k=0;k<3;k++){const s=spawnMon('ghost',m.x+rnd(-8,8),m.z+rnd(-8,8),{dun:'apt4'});s.aggro=true;s.summon=true}toast('🕯️ 촛불 유령 소환!')}
    else{m.nightDone=1;m.state='busy';m.wt=2.6;const f=R.scene.fog;const on=f.near,of=f.far;f.near=2;f.far=16;toast('🌑 호박 등불 말고는 아무것도 안 보인다…!','big');setTimeout(()=>{f.near=on;f.far=of},9000);for(let k=0;k<8;k++)setTimeout(()=>{if(!m.dead)eShoot(m,m.x,m.y+2.6,m.z,k*.785,8,m.atk*.7,0xffa020,true)},k*120)}}
}

function zoneGatePts(k){const pts=[];zoneEdges(k).forEach((e,ei)=>{if(Math.abs(e[1])>=WR-6)return;const lo=Math.max(e[2],-WR+8),hi=Math.min(e[3],WR-8);if(hi-lo<14)return;

function vDay(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10)}
function vHash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
const VQ_TYPES=[{t:'kill',target:'slime',cnt:8},{t:'kill',target:'rabbit',cnt:6},{t:'kill',target:'pig',cnt:6},{t:'kill',target:'bslime',cnt:6},{t:'mat',target:'herb',cnt:3},{t:'mat',target:'ore',cnt:3},{t:'mat',target:'relic',cnt:2},{t:'kill',target:'cat',cnt:5},{t:'kill',target:'stray',cnt:5}];
function vReqFor(i){const d=vDay();if(vHash(d+':'+i)%3!==0)return null;return VQ_TYPES[vHash(i+':'+d)%VQ_TYPES.length]}
function vqText(q){return q.t==='kill'?`${MON[q.target].n} ${Math.min(q.p,q.cnt)}/${q.cnt}`:`${ITEMS[q.target].n} ${S.inv.mats[q.target]||0}/${q.cnt} 가져오기`}

  if(it.t==='w')it.price=Math.round(Math.pow(it.atk,1.85)*7*tm/50)*50;
  else if(it.t==='a')it.price=Math.round((Math.pow(it.def,1.9)*8+it.hp*4)*tm/50)*50;
  else if(it.t==='c'&&(it.heal||it.mana)&&!it.cu&&!it.cu4&&!it.mk&&!it.bk&&k!=='fullpot')it.price=Math.max(60,Math.round(((it.heal||0)*.55+(it.mana||0)*1.1)*tm/10)*10);
  else if(it.t==='c'&&it.buff&&!it.cu&&!it.cu4&&!it.mk&&!it.bk&&!it.pet)it.price=Math.round(it.price*1.8/10)*10;
  else if(it.t==='c'&&(it.cu||it.cu4||it.mk||it.bk||it.pet))it.price=Math.round(it.price*1.5/10)*10;

async function mpInit(){if(MP.started)return;MP.started=true;mpUI();
  let room=null;try{if(window.claude&&typeof claude.use==='function')room=await claude.use('room')}catch(e){room=null}
  if(!room){MP.state='solo';mpStatus();mpSys('지금은 멀티 서버에 연결할 수 없어 혼자 플레이 중이에요. (Claude에 로그인한 상태에서 열면 같은 서버에 함께 나와요)');return}
  MP.room=room;let r=room;try{r=await room.join('sprout-world')}catch(e){r=room}MP.r=r;MP.state='on';
  try{r.onConnection(c=>{MP.conn=c;mpStatus()},e=>{MP.state='solo';mpStatus()})}catch(e){}
  try{r.onPeers(ch=>{ch.joined.forEach(p=>{if(!p.isMe&&p.presence&&p.presence.g===MPG&&MP.tick>40){const f=mpFriend(p.presence.f);if(f)mpSys(`💚 친구 ${mpPN(p)}님이 접속했어요`)}});ch.left.forEach(p=>{const pr=p.presence||{};if(pr.g===MPG&&mpFriend(pr.f))mpSys(`⚫ 친구 ${mpStr(pr.n,12)}님이 나갔어요`)});mpStatus()},()=>{})}catch(e){}
  mpSys('🌐 새싹 월드 서버에 접속했어요! 같은 게임을 연 모험가들이 와이파이·데이터·거리와 상관없이 함께 나와요.');mpStatus()}

function mpPush(kind,o){o.i=MP.seq++;o.ts=G.t;MP.out[kind].push(o);while(MP.out[kind].length>3)MP.out[kind].shift();MP.sendT=0}
function mpBuild(){const keep={c:6,q:25,s:10,h:2.5};for(const k in MP.out)MP.out[k]=MP.out[k].filter(o=>G.t-o.ts<keep[k]);
  const strip=a=>a.map(o=>{const c={...o};delete c.ts;return c});
  const hosting=G.t-MP.hostT<120||mpPeers().some(p=>p.presence.p==='h:'+mpFid());
  const pr={g:MPG,f:mpFid(),n:S.nick,t:S.title||null,tc:S.tagC||'def',j:S.job,lv:S.lv,cp:mpCp(),pw:(S.pvp&&S.pvp.w)||0,lk:mpLook(),p:mpPlace(),zn:mpZoneName(),
    x:Math.round(P.x*100)/100,y:Math.round(P.y*100)/100,z:Math.round(P.z*100)/100,r:Math.round(P.rot*100)/100,v:Math.round((P.spd||0)*10)/10,
    a:MP.actSeq?[MP.actSeq,MP.actKind]:null,hp:Math.round(clamp(P.hp/ST.mhp,0,1)*100),pt:MP.pt||null,cl:S.club?[S.club.id,S.club.n,S.club.e]:null,
    hd:S.home&&S.home.loc&&S.home.loc!=='village'?S.home.loc+':'+(S.home.dong||''):null,
    em:MP.emo?[MP.emo.i,MP.emo.k]:null,du:MP.duel&&MP.duel.on?[MP.duel.op,Math.max(0,Math.round(MP.duel.hp))]:null,
    hm:hosting?mpHomeData():null,c:MP.out.c.length?strip(MP.out.c):null,q:MP.out.q.length?strip(MP.out.q):null,s:MP.out.s.length?strip(MP.out.s):null,h:MP.out.h.length?strip(MP.out.h):null};
  return pr}
function mpHomeData(){const H_=S.home||{};return{l:H_.loc||'village',w:H_.wall|0,f:H_.floor|0,d:H_.dong||'',ho:H_.ho||'',i:(H_.items||[]).slice(0,40).map(it=>[it.id,Math.round(it.x*10),Math.round(it.z*10),it.r|0])}}
function mpSend(dt){if(!MP.r||MP.state!=='on')return;MP.sendT-=dt;if(MP.sendT>0)return;MP.sendT=.1;
  const pr=mpBuild();const patch={};let n=0;for(const k in pr){const js=JSON.stringify(pr[k]);if(MP.last[k]!==js){patch[k]=pr[k];MP.last[k]=js;n++}}
  if(!n)return;MP.r.presence(patch).catch(e=>{if(e&&e.code==='invalid_argument'){MP.out.c=[];MP.hostT=-99;MP.last={};}else if(e&&['not_granted','revoked','capability_disabled','capability_removed'].includes(e.code)){MP.state='solo';mpStatus()}})}

/* ---------- presence in ---------- */
function mpNew(av,p,key){const arr=p.presence[key];if(!Array.isArray(arr))return [];const seen=av.seen[key]||0;const out=arr.filter(o=>o&&typeof o==='object'&&+o.i>seen);if(arr.length)av.seen[key]=Math.max(seen,...arr.map(o=>+o.i||0));return av.first?[]:out}
function mpEach(dt){const ps=mpPeers();const live=new Set();const myPlace=mpPlace();const me=MP.myPeer=MP.r?((MP.r.peers().find(p=>p.sameTab)||{}).peer):null;
  ps.forEach(p=>{live.add(p.peer);let av=MP.av[p.peer];if(!av){av=MP.av[p.peer]={peer:p.peer,seen:{},first:true,h:null,lk:'',x:0,y:0,z:0,r:0,act:null,aSeq:0,eSeq:0,emoT:0,emoIc:'',bub:null,bubT:0,tag:null}}
    const pr=p.presence;
    // chat
    mpNew(av,p,'c').forEach(o=>mpOnChat(p,o));
    mpNew(av,p,'q').forEach(o=>{if(o.to===me)mpOnReq(p,o)});
    mpNew(av,p,'s').forEach(o=>{if(o.to===me)mpOnResp(p,o)});
    mpNew(av,p,'h').forEach(o=>{if(o.to===me)mpOnHit(p,o)});
    if(Array.isArray(pr.em)&&+pr.em[0]!==av.eSeq){const fst=!av.eSeq&&av.first;av.eSeq=+pr.em[0];const e=EMO[pr.em[1]];if(e&&!fst){av.emoIc=e.ic;av.emoT=e.d+.6;av.act={kind:e.p,t:0,dur:e.d};if(e.k==='spin')av.spin=e.d}}
    if(Array.isArray(pr.a)&&+pr.a[0]!==av.aSeq){const fst=av.first;av.aSeq=+pr.a[0];if(!fst){const k=String(pr.a[1]||'');if(POSES[k]){av.act={kind:k,t:0,dur:k==='cast'?.6:.42}}mpAssist(p,av)}}
    av.first=false;
    // avatar
    const same=pr.p===myPlace;const lkKey=JSON.stringify(pr.lk||{});
    if(same&&(!av.h||av.lk!==lkKey)){if(av.h)R.world.remove(av.h);try{av.h=mpMakeAv(pr.lk||{})}catch(e){av.h=makeHuman({})}av.lk=lkKey;R.world.add(av.h);av.x=mpNum(pr.x,-1e5,1e5);av.z=mpNum(pr.z,-1e5,1e5);av.y=mpNum(pr.y,-50,500);av.r=mpNum(pr.r,-50,50)}
    if(av.h){av.h.visible=same;if(same){const tx=mpNum(pr.x,-1e5,1e5),tz=mpNum(pr.z,-1e5,1e5),ty=mpNum(pr.y,-50,500);if(Math.hypot(tx-av.x,tz-av.z)>25){av.x=tx;av.z=tz}const k=Math.min(1,dt*10);av.x=lerp(av.x,tx,k);av.z=lerp(av.z,tz,k);av.y=lerp(av.y,ty,k);av.r=lerpAng(av.r,mpNum(pr.r,-50,50),k);
      av.h.position.set(av.x,av.y,av.z);let ry=av.r;if(av.spin>0){av.spin-=dt;ry+=av.spin*14}av.h.rotation.y=ry;if(av.act){av.act.t+=dt;if(av.act.t>=av.act.dur)av.act=null}
      animHuman(av.h,dt,{spd:mpNum(pr.v,0,40),run:6.4,act:av.act,armed:av.h.userData.armed,air:false})}}
    av.emoT=Math.max(0,av.emoT-dt);av.bubT=Math.max(0,av.bubT-dt);
    mpTag(av,p,same)});
  for(const k in MP.av)if(!live.has(k)){const av=MP.av[k];if(av.h)R.world.remove(av.h);if(av.tag)av.tag.remove();delete MP.av[k];if(MP.duel&&MP.duel.op===k&&MP.duel.on){mpDuelEnd(null,'상대가 떠났어요')}}}
function mpMakeAv(lk){const sk=SKINS[lk.k]||SKINS.basic;const aid=ITEMS[lk.a]?lk.a:null;const al=(aid&&ARMOR_LOOK[aid])||{};const g=lk.g==='f'?'f':'m';const defB=g==='f'?0xd0566e:0x3b6ea5;const dye=typeof lk.d==='number'?lk.d:null;const bodyC=dye??sk.body;const shirt=bodyC??al.tint??defB;const pants=bodyC!=null?new T.Color(bodyC).multiplyScalar(.5).getHex():(g==='f'?0x5a2a3a:0x2c3a4f);
  const hs=['short','long','spiky','bob','ponytail','bun','bald'].includes(lk.hs)?lk.hs:(g==='f'?'long':'short');
  const h=makeHuman({gender:g,hair:HAIRS[lk.h|0]??HAIRS[0],skin:SKINT[lk.s|0]??SKINT[0],hairStyle:lk.hs?hs:(g==='f'?'long':'short'),shirt,pants,acc:sk.acc??(g==='f'?0xffe0ea:0x6b4a2e),pads:al.pads,boots:al.boots,cape:sk.fx==='cape'?sk.acc:al.cape,eye:[0x4a3020,0x2a5a8a,0x3a7a3a][(lk.s|0)%3]});
  const J=h.userData.rig.J;if(aid){try{armorDeco(J,aid)}catch(e){}}const wid=ITEMS[lk.w]&&ITEMS[lk.w].wt?lk.w:'sw1';const it=ITEMS[wid];let wm;try{wm=weaponMesh(wid,mpNum(lk.e,0,30)|0)}catch(e){wm=weaponMesh('sw1')}
  if(it.wt==='bow')J.gripL.add(wm);else J.gripR.add(wm);if(it.wt==='dagger'){try{J.gripL.add(weaponMesh(wid,0))}catch(e){}}h.userData.armed=it.wt==='any'||it.wt==='moon'?'sword':it.wt;
  if(lk.hat==='pumpkin'){try{const ph=pumpkinHead(.85,true);ph.position.y=.36;J.head.add(ph)}catch(e){}}
  h.traverse(o=>{if(o.isMesh)o.castShadow=false});return h}

const _mv=new T.Vector3();
function mpTagEl(cls){const el=document.createElement('div');el.className='mptag '+(cls||'');el.innerHTML='<div class="mpb"></div><div class="mpe"></div><div class="mpt"></div><div class="mpn"></div><div class="mphp"><i></i></div>';$('#mpTags').appendChild(el);return el}
function mpTagFill(el,o){const key=JSON.stringify(o);if(el._k===key)return;el._k=key;el.querySelector('.mpt').textContent=o.t?'「'+o.t+'」':'';el.querySelector('.mpt').style.display=o.t?'':'none';

function mpTag(av,p,same){const pr=p.presence;if(!av.tag){av.tag=mpTagEl();av.tag.onclick=()=>mpPlayerMenu(p.peer)}const el=av.tag;

  mpTagFill(el,{t:mpStr(pr.t,16),n:mpPN(p),lv:mpNum(pr.lv,1,999)|0,fr:!!mpFriend(pr.f),pt:!!(MP.pt&&pr.pt===MP.pt),on:true,cl,tc:pr.tc,hpShow:!!(MP.pt&&pr.pt===MP.pt)||!!(MP.duel&&MP.duel.op===p.peer)});
  el.querySelector('.mphp i').style.width=(MP.duel&&MP.duel.op===p.peer&&Array.isArray(pr.du)?mpNum(pr.du[1],0,100):mpNum(pr.hp,0,100))+'%';
  const e=el.querySelector('.mpe');e.textContent=av.emoT>0?av.emoIc:'';e.style.display=av.emoT>0?'':'none';
  const b=el.querySelector('.mpb');b.style.display=av.bubT>0?'':'none';if(av.bubT>0&&b._t!==av.bub){b._t=av.bub;b.textContent=av.bub}}

/* ---------- chat ---------- */
function mpSys(t){mpLogAdd({sys:1,m:t})}
function mpLogAdd(o){o.at=Date.now();MP.log.push(o);if(MP.log.length>80)MP.log.shift();mpRenderLog()}
function mpChVis(o){if(o.sys)return true;if(MP.ch==='all')return o.ch==='all'||o.ch==='pt'||o.ch==='cl'||o.ch==='dm';return o.ch===MP.ch}
function mpRenderLog(){const box=$('#mpLog');if(!box)return;const L=MP.log.filter(mpChVis).slice(-40);
  box.innerHTML=L.map(o=>o.sys?`<div class="sys">${esc(o.m)}</div>`:`<div class="m ${o.ch}"><b>${o.ch==='pt'?'[파티] ':o.ch==='cl'?'[클럽] ':o.ch==='dm'?(o.mine?`[→${esc(o.toN||'')}] `:'[귓말] '):''}${esc(o.n)}${o.fr?' 💚':''}</b> ${esc(o.m)}</div>`).join('');box.scrollTop=1e9}
function mpOnChat(p,o){const ch=['all','pt','cl','dm'].includes(o.ch)?o.ch:'all';const pr=p.presence;const m=mpStr(o.m,80);if(!m)return;
  if(ch==='pt'&&!(MP.pt&&o.to===MP.pt))return;if(ch==='cl'&&!(S.club&&o.to===S.club.id))return;if(ch==='dm'&&o.to!==mpFid())return;
  if((S.block||[]).includes(pr.f))return;
  mpLogAdd({ch,n:mpPN(p),m,fr:!!mpFriend(pr.f),from:pr.f});
  if(ch==='dm'){MP.lastDm={f:pr.f,n:mpPN(p)};toast(`💌 ${mpPN(p)}: ${m}`)}
  const av=MP.av[p.peer];if(av&&ch!=='dm'){av.bub=m;av.bubT=5}
  if($('#mpChat').classList.contains('mini')){MP.unread++;mpStatus()}}
function mpSendChat(text){text=mpStr(text,80).trim();if(!text)return;if(G.t<MP.chatCd)return toast('채팅은 조금 천천히!');MP.chatCd=G.t+.7;
  if(text.startsWith('/')){mpCmd(text);return}
  let ch=MP.ch,to=null,toN=null;if(ch==='pt'){if(!MP.pt){mpSys('파티가 없어요. 「👥 소셜」에서 파티를 만들어 보세요');return}to=MP.pt}else if(ch==='cl'){if(!S.club){mpSys('가입한 클럽이 없어요');return}to=S.club.id}else if(ch==='dm'){if(!MP.dmTo){mpSys('귓속말 상대를 먼저 골라 주세요 (친구 목록 · 플레이어 메뉴)');return}to=MP.dmTo.f;toN=MP.dmTo.n}
  mpPush('c',{ch,m:text,to});mpLogAdd({ch,n:S.nick,m:text,mine:1,toN});if(ch!=='dm'){MP.myBub=text;MP.myBubT=5}
  if(MP.state!=='on')mpSys('(혼자 플레이 중이라 다른 사람에게는 보이지 않아요)')}
function mpCmd(t){const [c,...rest]=t.slice(1).split(' ');const arg=rest.join(' ');
  const e=EMOTES.find(x=>x.n===c||x.k===c);if(e)return mpEmote(e.k);
  if(c==='도움'||c==='help')return mpSys('명령어: /인사 /춤 /박수 … (이모트 이름) · /귓 닉네임 할말 · /파티 메시지 · /클럽 메시지');
  if(c==='귓'){const [nk,...m]=rest;const p=mpPeers().find(p=>mpPN(p)===nk);if(!p)return mpSys('그 닉네임의 접속자를 찾지 못했어요');MP.dmTo={f:p.presence.f,n:mpPN(p)};const old=MP.ch;MP.ch='dm';mpSendChat(m.join(' '));MP.ch=old;return}
  if(c==='파티'||c==='클럽'){const old=MP.ch;MP.ch=c==='파티'?'pt':'cl';MP.chatCd=0;mpSendChat(arg);MP.ch=old;return}
  mpSys('모르는 명령어예요. /도움 을 입력해 보세요')}

/* ---------- ranking: online + device + share codes ---------- */
const RC_KEY='sprout_rankcodes_v1';
function rcSum(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return (h%46656).toString(36).padStart(3,'0')}
function rcMake(){const o={n:S.nick,l:S.lv,j:S.job,c:mpCp(),w:(S.pvp&&S.pvp.w)||0,t:Math.floor(Date.now()/1000)};const b=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,'');return 'SP-'+b+'-'+rcSum(b)}
function rcRead(code){try{code=String(code).trim();const m=code.match(/^SP-([A-Za-z0-9+/]+)-([0-9a-z]{3})$/);if(!m||rcSum(m[1])!==m[2])return null;const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o||typeof o!=='object')return null;return{nick:mpStr(o.n,12)||'모험가',lv:mpNum(o.l,1,MAXLV)|0,job:JOBS[o.j]?o.j:'novice',cp:mpNum(o.c,0,1e9)|0,pw:mpNum(o.w,0,1e6)|0,t:mpNum(o.t,0,4e9)|0,code:1}}catch(e){return null}}
function rankRow(r,i,meNick){return `<div class="rank"><b>${i<3?['🥇','🥈','🥉'][i]:i+1}</b><span>${esc(r.nick||'모험가')}${r.nick===meNick&&r.me?' (나)':''} <small style="color:var(--muted)">${(JOBS[r.job]||JOBS.novice).n}${r.pw?' · PvP '+r.pw+'승':''}</small></span><span style="color:var(--muted)">Lv.${r.lv}</span><span class="price">${r.cp?fmt(r.cp):'-'}</span></div>`}
function rankTab(body,rer){let sub=MP.rsub||'online';const me={nick:S.nick,lv:S.lv,job:S.job,cp:mpCp(),pw:(S.pvp&&S.pvp.w)||0,me:1};
  body.innerHTML+=`<div class="tabs" style="margin-top:-4px">${[['online','🟢 지금 접속자'],['device','📱 이 기기'],['code','🔗 랭킹 코드'],['acct','☁️ Claude 계정']].map(([k,n])=>`<button data-r="${k}" class="${k===sub?'on':''}">${n}</button>`).join('')}</div><div id="rkB"></div>`;
  const B=body.querySelector('#rkB');
  if(sub==='online'){const rows=[me,...mpPeers().map(p=>({nick:mpPN(p),lv:mpNum(p.presence.lv,1,999)|0,job:p.presence.j,cp:mpNum(p.presence.cp,0,1e9)|0,pw:mpNum(p.presence.pw,0,1e6)|0}))].sort((a,b)=>b.cp-a.cp);B.innerHTML='<p class="note">같은 서버에 지금 접속한 모험가들의 전투력 순위예요</p>'+rows.map((r,i)=>rankRow(r,i,S.nick)).join('')}
  if(sub==='device'){const rows=Object.values(ACCS||{}).filter(a=>a&&a.save).map(a=>{const s=a.save;return{nick:s.nick,lv:s.lv|0,job:s.job,cp:s.cpRec|0,pw:(s.pvp&&s.pvp.w)||0,me:a.save.nick===S.nick?1:0}});const mi=rows.findIndex(r=>r.nick===S.nick);if(mi>=0)rows[mi]=me;else rows.push(me);rows.sort((a,b)=>b.cp-a.cp||b.lv-a.lv);B.innerHTML='<p class="note">이 기기(브라우저)에 저장된 모든 캐릭터의 순위예요 · 클라우드 없이도 돼요</p>'+rows.map((r,i)=>rankRow(r,i,S.nick)).join('')}
  if(sub==='code'){let list=LS.get(RC_KEY)||[];const rows=[me,...list].sort((a,b)=>b.cp-a.cp);const code=rcMake();
    B.innerHTML=`<p class="note">클라우드 없이 친구와 순위를 겨루는 방법: 내 랭킹 코드를 복사해서 친구에게 보내고, 친구 코드를 아래에 붙여 넣으세요.</p><div class="post"><h4>내 랭킹 코드</h4><textarea id="rcMy" readonly style="width:100%;height:54px;font-size:11px">${esc(code)}</textarea><button class="btn sm" id="rcCopy">📋 복사</button></div><div class="post"><h4>친구 코드 추가</h4><div style="display:flex;gap:8px"><input id="rcIn" placeholder="SP-로 시작하는 코드" style="flex:1"><button class="btn sm" id="rcAdd">추가</button></div></div>`+rows.map((r,i)=>rankRow(r,i,S.nick)+(r.me?'':`<div style="text-align:right;margin:-6px 0 4px"><button class="btn sec sm" data-rx="${esc(r.nick)}" style="padding:2px 8px;font-size:11px">지우기</button></div>`)).join('');
    B.querySelector('#rcCopy').onclick=()=>{const t=B.querySelector('#rcMy');t.select();try{navigator.clipboard.writeText(code).then(()=>toast('📋 복사했어요!'),()=>{document.execCommand('copy');toast('📋 복사했어요!')})}catch(e){try{document.execCommand('copy');toast('📋 복사했어요!')}catch(e2){toast('코드를 길게 눌러 복사하세요')}}};
    B.querySelector('#rcAdd').onclick=()=>{const r=rcRead(B.querySelector('#rcIn').value);if(!r)return toast('올바른 랭킹 코드가 아니에요');list=list.filter(x=>x.nick!==r.nick);list.push(r);list=list.slice(-50);LS.set(RC_KEY,list);toast(`🔗 ${r.nick}님의 기록을 추가했어요`);rer()};
    B.querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>{list=list.filter(x=>x.nick!==b.dataset.rx);LS.set(RC_KEY,list);rer()})}
  if(sub==='acct'){B.innerHTML='<p class="note">불러오는 중…</p>';pushRank();fetchRank().then(list=>{if(!B.isConnected)return;const rows=list&&list.length?list:[me];B.innerHTML=`<p class="note">${list?'Claude 계정마다 최고 캐릭터 하나가 올라가요':'지금은 Claude 계정 랭킹에 연결할 수 없어요 — 「이 기기」나 「랭킹 코드」를 써 보세요'}</p>`+rows.map((r,i)=>rankRow(r,i,S.nick)).join('')})}
  body.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{MP.rsub=b.dataset.r;rer()})}

  <div class="post" style="border-color:#5a8a6a"><b>💎 보유 다이아 ${fmt(S.gems)}</b><p class="note" style="margin:6px 0 0">이 게임에는 실제 돈으로 결제하는 기능이 없어요. 다이아는 출석 · 레벨업(+5) · 업적 · 클럽 출석 · 교환소에서 모을 수 있어요!</p></div><div class="list" id="dsL"></div>`;
