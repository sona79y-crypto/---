<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>휘블록스</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700;800&family=JetBrains+Mono:wght@600;800&display=swap"><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Gothic A1","Apple SD Gothic Neo",sans-serif;color:#f2f4f8;touch-action:none;user-select:none;-webkit-user-select:none}

#hud:empty{display:none}
#ui{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:4;background:rgba(6,8,14,.55);backdrop-filter:blur(2px)}
#ui[hidden]{display:none}
.card{width:min(380px,100%);max-height:calc(100% - 8px);overflow:auto;background:linear-gradient(#1c2130,#151925);border:2px solid #2c3346;border-radius:20px;padding:20px;display:grid;gap:11px;text-align:center;box-shadow:0 10px 0 #0b0d14,0 20px 40px rgba(0,0,0,.4);animation:pop .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.card h1{margin:0;font-family:"Black Han Sans","Gothic A1",sans-serif;font-weight:400;font-size:40px;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.card h2{margin:0;font-family:"Black Han Sans","Gothic A1",sans-serif;font-weight:400;font-size:26px}
.card p{margin:0;color:#b4bccd;font-size:14px;line-height:1.55}
.row{display:flex;justify-content:space-between;align-items:center}
.kick{font-size:12px;letter-spacing:.14em;color:#ffc531;font-weight:800}
.bux{display:flex;align-items:center;gap:5px;font:800 13px "JetBrains Mono",monospace;background:#0f121b;border-radius:999px;padding:4px 10px}
.bux i{width:15px;height:15px;border-radius:4px;background:#ffc531;color:#5a3d00;font:900 9px "Gothic A1";font-style:normal;display:grid;place-items:center}
.best{font:700 13px "JetBrains Mono",monospace;color:#7fe0c8}
.reward{font:800 13px "Gothic A1";color:#ffd66b;background:rgba(255,197,49,.1);border-radius:10px;padding:7px}
.foot{font-size:12px;color:#7d869b}
.card button{font:800 17px "Gothic A1",sans-serif;border:0;border-radius:13px;padding:13px;cursor:pointer;background:#ffc531;color:#1b1406;box-shadow:0 4px 0 #b88a12}
.card button:active{transform:translateY(2px);box-shadow:0 2px 0 #b88a12}
.card button.ghost{background:#2a3144;color:#f2f4f8;box-shadow:0 4px 0 #11141d;font-size:14px;padding:11px 8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px}
.tabs{display:flex;gap:6px;justify-content:center}
.card .tabs button{background:#232a3b;color:#aeb6c8;box-shadow:none;padding:7px 16px;font-size:14px;border-radius:999px}
.card .tabs button.on{background:#f2f4f8;color:#14182b}
.list{display:grid;gap:7px;text-align:left;max-height:46vh;overflow:auto}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#11151f;border:1px solid #262d3e;border-radius:12px;padding:9px 11px}
.item b{font-size:14px;display:block}.item small{font-size:12px;color:#8e97ab;display:block;line-height:1.35}
.item .lv{font:800 11px "JetBrains Mono";color:#ffc531;letter-spacing:-1px;width:40px}
.item .sw{width:28px;height:28px;border-radius:8px;display:block;border:2px solid rgba(255,255,255,.25)}
.item .on{font-size:12px;font-weight:800;color:#7fe0c8}
.card button.mini{font-size:13px;padding:7px 12px;border-radius:10px;box-shadow:0 3px 0 #b88a12}
.card button.mini:not(.buy){background:#3a4359;color:#fff;box-shadow:0 3px 0 #1a1f2b}
.rk .no{font:800 15px "JetBrains Mono";width:26px;text-align:center;color:#ffc531}
.rk.me{border-color:#7fe0c8;background:#13251f}.rk em,.vs em{font-style:normal;font-size:10px;background:#6a4cff;color:#fff;border-radius:5px;padding:1px 5px;vertical-align:2px}
.rk .sc{font:800 14px "JetBrains Mono"}
.vs{font-size:16px!important;color:#fff!important}
.count{font:400 64px "Black Han Sans";color:#ffc531}
.duelres{background:#11151f;border-radius:12px;padding:10px;display:grid;gap:3px;font-size:14px;color:#aeb6c8}
.duelres b{font:400 28px "Black Han Sans"}.duelres.win b{color:#ffc531}.duelres.lose b{color:#ff8a7a}
.ktoast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:#f2f4f8;color:#14182b;font-weight:800;padding:10px 16px;border-radius:12px;font-size:14px}
</style></head><body><canvas id="c"></canvas><div id="ui"></div><div id="top"><button id="back">← 나가기</button><button id="mute">🔊</button><span id="hud"></span></div><script>/* 휘블록스 game kit v2: fitting, loop, input, joystick/buttons, sound, juice, title/shop/ranking/duel/pause panels, platform API */
const K=(()=>{const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),ui=$('ui'),hud=$('hud');
  const K={cv,ctx,W:480,H:720,state:'title',t:0,cur:0,keys:{},btn:{},joy:{x:0,y:0,on:false},ptr:{x:0,y:0,down:false}};let cfg,last=performance.now(),ac=null,muted=false;
  /* ---- platform API (hub on the same origin) with a standalone fallback ---- */
  const store={get(k,d){try{const v=localStorage.getItem('hwi-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('hwi-'+k,JSON.stringify(v))}catch(e){}}};K.store=store;
  let API=null;try{if(parent!==window&&parent.hwiApi)API=parent.hwiApi}catch(e){}
  if(!API){const L=()=>store.get('solo',{bux:200,g:{}}),S=v=>store.set('solo',v),G=(s,id)=>s.g[id]||(s.g[id]={ups:{},skins:[],skin:null,best:null,plays:0});
    API={me:()=>({name:'혼자 하기',bux:L().bux,job:'adv',jobLv:1}),game:id=>G(L(),id),mods:()=>({coin:1,xp:1,life:0,luck:1,duel:1}),
      buy(id,kind,item,cost){const s=L();if(s.bux<cost)return{ok:false,bux:s.bux};s.bux-=cost;const g=G(s,id);if(kind==='up')g.ups[item]=(g.ups[item]||0)+1;else{g.skins.push(item);g.skin=item}S(s);return{ok:true,bux:s.bux}},
      equip(id,item){const s=L();G(s,id).skin=item;S(s)},score(id,sc,won,lower){const s=L(),g=G(s,id);g.plays++;const nb=g.best==null||(lower?sc<g.best:sc>g.best);if(nb)g.best=sc;const rw=Math.max(1,Math.min(40,Math.round(sc/ (cfg.par||100)*15)));s.bux+=rw;S(s);return{reward:rw,xp:rw*2,newBest:nb,best:g.best}},
      live(){},duel:()=>null,duelState:()=>null,findDuel(){alert('듀얼은 휘블록스 안에서 할 수 있다')},rank:async id=>[{n:'나',s:G(L(),id).best||0,me:true}],exit(){history.back()}}}
  K.api=API;const D=API.duel&&API.duel();K.duel=D||null;
  /* seeded gameplay random: duels share the seed so both players get the same run */
  let seed=(D?D.seed:(Math.random()*2**32))>>>0;const sr=()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};K.rand=sr;
  const rnd=(a,b)=>a+sr()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));K.rnd=rnd;K.clamp=clamp;K.pick=a=>a[Math.floor(sr()*a.length)];K.dist=(a,b,c,d)=>Math.hypot(c-a,d-b);K.ri=(a,b)=>Math.floor(rnd(a,b+1));
  K.shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(sr()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};K.lerp=(a,b,t)=>a+(b-a)*t;
  /* ---- drawing helpers ---- */
  K.C=(x,y,r,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);ctx.fill()};
  K.R=(x,y,w,h,r,col)=>{ctx.fillStyle=col;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)));else ctx.rect(x,y,w,h);ctx.fill()};
  K.SR=(x,y,w,h,r,col,lw=2)=>{ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)));else ctx.rect(x,y,w,h);ctx.stroke()};
  K.L=(x1,y1,x2,y2,w,col)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};
  K.T=(t,x,y,size,col,align='center',weight=700,font)=>{ctx.font=`${weight} ${size}px ${font||'"Gothic A1","Apple SD Gothic Neo",sans-serif'}`;ctx.textAlign=align;ctx.fillStyle=col;ctx.fillText(t,x,y)};
  K.TD=(t,x,y,size,col,align='center')=>K.T(t,x,y,size,col,align,400,'"Black Han Sans","Gothic A1",sans-serif');
  K.TS=(t,x,y,size,col,align='center',weight=800)=>{ctx.font=`${weight} ${size}px "Gothic A1",sans-serif`;ctx.textAlign=align;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineJoin='round';ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)};
  K.poly=(pts,col)=>{ctx.fillStyle=col;ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()};
  K.bar=(x,y,w,h,v,col,bg='rgba(255,255,255,.12)')=>{K.R(x,y,w,h,h/2,bg);if(v>0)K.R(x,y,Math.max(h,w*clamp(v,0,1)),h,h/2,col)};
  K.grad=(y0,y1,a,b)=>{const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g};
  K.wrap=(t,x,y,maxW,size,col,lh=1.45,align='center',weight=600)=>{ctx.font=`${weight} ${size}px "Gothic A1",sans-serif`;const words=String(t).split(' ');let line='',yy=y;for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){K.T(line,x,yy,size,col,align,weight);line=w;yy+=size*lh}else line=test}if(line)K.T(line,x,yy,size,col,align,weight);return yy+size*lh};
  /* ---- juice: particles, popups, shake, flash ---- */
  let parts=[],pops=[],shk=0,flash=0,flashCol='#fff';
  K.fx=(x,y,col,n=10,sp=180,life=.6,size=3)=>{for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random()*.7);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,l:life*(.6+Math.random()*.6),c:col,s:size*(.6+Math.random()*.8)})}};
  K.pop=(t,x,y,col='#fff',size=20)=>pops.push({t,x,y,c:col,s:size,a:0});K.shake=a=>{shk=Math.max(shk,a)};K.flash=(c='#fff',a=.5)=>{flash=a;flashCol=c};
  /* ---- sound ---- */
  function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}K.audio=()=>ac;
  K.tone=(f,d=.1,v=.08,type='square',slide=0,delay=0)=>{if(!ac||muted)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)};
  K.noise=(d=.12,v=.15,f=900)=>{if(!ac||muted)return;const t=ac.currentTime,b=ac.createBuffer(1,Math.max(1,ac.sampleRate*d|0),ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=ac.createBufferSource(),bf=ac.createBiquadFilter(),g=ac.createGain();bf.type='bandpass';bf.frequency.value=f;g.gain.value=v;s.buffer=b;s.connect(bf);bf.connect(g);g.connect(ac.destination);s.start(t)};
  K.chord=(fs,d=.25,v=.05,type='triangle')=>fs.forEach((f,i)=>K.tone(f,d,v,type,0,i*.06));K.win=()=>K.chord([523,659,784,1047],.3,.06);K.hit=()=>{K.noise(.08,.18,500);K.tone(120,.08,.08,'square',.5)};K.coin=()=>{K.tone(988,.06,.05,'square');K.tone(1319,.12,.05,'square',0,.06)};
  /* ---- fit & input ---- */
  function fit(){const sc=Math.min(innerWidth/K.W,innerHeight/K.H),dpr=Math.min(2,devicePixelRatio||1);cv.style.width=Math.floor(K.W*sc)+'px';cv.style.height=Math.floor(K.H*sc)+'px';cv.width=Math.floor(K.W*sc*dpr);cv.height=Math.floor(K.H*sc*dpr);K.px=sc*dpr;K.css=sc}
  function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*K.W,(e.clientY-r.top)/r.height*K.H]}
  const touches=new Map();let joyId=null,jx=0,jy=0;
  const hitBtn=(x,y)=>(cfg.buttons||[]).find(b=>Math.hypot(x-b.x,y-b.y)<(b.r||40)+8);
  cv.addEventListener('pointerdown',e=>{audio();e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const [x,y]=pos(e);K.ptr={x,y,down:true};if(K.state!=='play')return;
    const b=hitBtn(x,y);if(b){touches.set(e.pointerId,{btn:b.id});K.btn[b.id]=true;if(cfg.press)cfg.press(b.id);return}
    if(cfg.stick&&joyId==null&&(cfg.stick===true||y>cfg.stick)){joyId=e.pointerId;jx=x;jy=y;K.joy={x:0,y:0,on:true,cx:x,cy:y};touches.set(e.pointerId,{joy:1});if(!cfg.down)return}
    if(cfg.down)cfg.down(x,y,e)});
  cv.addEventListener('pointermove',e=>{const [x,y]=pos(e);K.ptr.x=x;K.ptr.y=y;if(K.state!=='play')return;if(e.pointerId===joyId){let dx=x-jx,dy=y-jy;const m=Math.hypot(dx,dy),R=55;if(m>R){jx=x-dx/m*R;jy=y-dy/m*R;dx=x-jx;dy=y-jy}K.joy={x:dx/R,y:dy/R,on:true,cx:jx,cy:jy}}if(cfg.move)cfg.move(x,y,e)});
  const up=e=>{const [x,y]=pos(e);K.ptr.down=false;const t=touches.get(e.pointerId);touches.delete(e.pointerId);if(t&&t.btn){K.btn[t.btn]=false;if(cfg.release)cfg.release(t.btn);return}if(e.pointerId===joyId){joyId=null;K.joy={x:0,y:0,on:false}}if(K.state==='play'&&cfg.up)cfg.up(x,y,e)};
  addEventListener('pointerup',up);addEventListener('pointercancel',up);
  addEventListener('pointerdown',()=>{try{window.focus()}catch(_){}},true);addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;audio();const k=(e.key.length===1&&/[\u3131-\u318e]/.test(e.key)&&/^Key[A-Z]$/.test(e.code||''))?e.code.slice(3).toLowerCase():e.key.length===1?e.key.toLowerCase():e.key;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
    if(K.state==='play'&&(k==='Escape'||k==='p')&&!D){pause();return}if(K.state==='pause'&&(k==='Escape'||k==='p')){resume();return}
    if((K.state==='title'||K.state==='over')&&(k==='Enter'||k===' ')&&!ui.querySelector('.sub')){if(!D)K.start();return}if(K.state!=='play')return;if(!e.repeat)K.keys[k]=true;if(cfg.key&&!e.repeat)cfg.key(k,true)});
  addEventListener('keyup',e=>{const k=(e.key.length===1&&/[\u3131-\u318e]/.test(e.key)&&/^Key[A-Z]$/.test(e.code||''))?e.code.slice(3).toLowerCase():e.key.length===1?e.key.toLowerCase():e.key;K.keys[k]=false;if(K.state==='play'&&cfg.keyup)cfg.keyup(k)});
  addEventListener('blur',()=>{K.keys={};if(K.state==='play'&&!D)pause()});
  /* movement vector from keys + joystick */
  K.axis=()=>{let x=(K.keys.ArrowRight||K.keys.d?1:0)-(K.keys.ArrowLeft||K.keys.a?1:0),y=(K.keys.ArrowDown||K.keys.s?1:0)-(K.keys.ArrowUp||K.keys.w?1:0);if(K.joy.on&&Math.hypot(K.joy.x,K.joy.y)>.15){x=K.joy.x;y=K.joy.y}const m=Math.hypot(x,y);return m>1?{x:x/m,y:y/m}:{x,y}};
  /* ---- progression read by games ---- */

  K.up=id=>{const g=API.game(cfg.id);return (g.ups||{})[id]||0};K.lives=n=>n+(mods().life||0);K.luck=()=>mods().luck||1;
  K.skin=()=>{const g=API.game(cfg.id),sk=cfg.skins||[];const s=sk.find(x=>x[0]===g.skin);return(s||sk[0]||[0,0,'#fff'])[2]};
  K.score=s=>{K.cur=s;if(D&&K.state==='play')API.live(cfg.id,s)};
  /* ---- panels ---- */
  const fmt=s=>s==null?'-':cfg.fmt?cfg.fmt(s):Math.round(s).toLocaleString();
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function panel(html){ui.innerHTML=`<div class="card">${html}</div>`;ui.hidden=false;ui.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{audio();K.tone(520,.04,.04,'triangle');ACT[b.dataset.a](b.dataset.v)})}
  const me=()=>API.me(),bx=()=>`<div class="bux"><i>휘</i>${me().bux.toLocaleString()}</div>`;
  const ACT={start:()=>K.start(),title:()=>title(),shop:v=>shop(v||'up'),rank:()=>rank(),duel:()=>{API.findDuel(cfg.id)},hub:()=>API.exit(),resume:()=>resume(),
    buy(v){const [kind,id]=v.split(':');let cost;if(kind==='up'){const u=cfg.ups.find(x=>x[0]===id),lv=K.up(id);if(lv>=u[3])return;cost=Math.round(u[4]*Math.pow(1.8,lv))}else cost=cfg.skins.find(x=>x[0]===id)[3];const r=API.buy(cfg.id,kind,id,cost);if(r.ok){K.coin();toastIn(kind==='up'?'강화 완료!':'스킨을 샀다!')}else toastIn(`휘벅스가 ${cost-r.bux}개 모자라다`);shop(kind)},
    equip(id){API.equip(cfg.id,id);shop('skin')},restart:()=>{ui.hidden=true;K.state='play';K.start()}};
  function toastIn(t){const d=document.createElement('div');d.className='ktoast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}K.toast=toastIn;
  function title(){K.state='title';const g=API.game(cfg.id),best=g.best;const m=me();
    panel(`<div class="row"><span class="kick">휘블록스</span>${bx()}</div><h1>${esc(cfg.name)}</h1><p>${esc(cfg.how)}</p>
    <div class="best">최고 기록 · ${fmt(best)}${g.plays?` · ${g.plays}판`:''}</div>
    <button data-a="start">시작</button><div class="grid3">${cfg.duel!==false?'<button class="ghost" data-a="duel">⚔ 듀얼</button>':''}${(cfg.ups||cfg.skins)?'<button class="ghost" data-a="shop">상점</button>':''}<button class="ghost" data-a="rank">랭킹</button></div>
